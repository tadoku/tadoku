kubeContext: homelab-talos-dev
namespace: tdk-dev-routing
namespaces:
  - tdk-dev-routing
  - tdk-dev-data
  - tdk-dev-frontend-webv2
  - tdk-dev-frontend-auth
  - tdk-dev-frontend-admin
  - tdk-dev-oathkeeper
  - tdk-dev-tadoku-api
registry: registry.dev.lab/tadoku-dev-cli
ingressHost: tadoku.dev.lab
publicHosts:
  - tadoku.dev.lab
  - account.tadoku.dev.lab
  - admin.tadoku.dev.lab
ingressClass: nginx
clusterIssuer: lab-ca-acme
gatewayName: dev-cli-playground
gatewayNamespace: envoy-gateway-system
internalGateway: http://dev-cli-gateway.tdk-dev-routing.svc.cluster.local
ttl: 8h
variables:
  DATABASE: tadoku
  TENANT: tadoku/${DEV_ROUTE}
hooks:
  beforeUp: [tenant]
  afterDown: [tenant-teardown]
  deployables:
    tadoku-worker:
      beforeStart: [worker-override-set]
      afterStop: [worker-override-clear]
profiles:
  - name: isolated-database
    whenChanged: [services/tadoku-api/migrations/]
    variables:
      DATABASE: tadoku-${DEV_ROUTE}
    hooks:
      beforeUp: [migrate, tenant]
bazelArgs:
  - --platforms=@rules_go//go/toolchain:linux_amd64
  - --@rules_go//go/config:pure
  - --jobs=2
dependencies:
  - name: database
    namespace: tdk-dev-data
    manifest: .dev/database.yaml
    retention: down
    readiness:
      - resource: job
        name: tadoku-${DEV_ROUTE}
        condition: Complete
        timeout: 300s
tasks:
  - name: migrate
    namespace: tdk-dev-data
    manifest: .dev/migrate.yaml
    target: tadoku-dev-db.tdk-dev-data/tadoku-${DEV_ROUTE}
    dependencies:
      - database
    timeout: 5m
    imageName: migrate
    pushTarget: //services/tadoku-api/migrations:dev_push
    container: migrate
  - name: tenant
    namespace: tdk-dev-data
    manifest: .dev/tenant.yaml
    target: tadoku-dev-db.tdk-dev-data/tadoku-${DEV_ROUTE}
    timeout: 5m
    imageName: tenant
    pushTarget: //.dev:tenant_push
    container: tenant
  - name: tenant-teardown
    namespace: tdk-dev-data
    manifest: .dev/tenant-teardown.yaml
    target: tadoku-dev-db.tdk-dev-data/tadoku-${DEV_ROUTE}
    timeout: 5m
    imageName: tenant
    pushTarget: //.dev:tenant_push
    container: tenant
  - name: worker-override-set
    namespace: tdk-dev-data
    manifest: .dev/worker-override-set.yaml
    target: tadoku-dev-db.tdk-dev-data/tadoku-${DEV_ROUTE}
    timeout: 5m
    imageName: tenant
    pushTarget: //.dev:tenant_push
    container: tenant
  - name: worker-override-clear
    namespace: tdk-dev-data
    manifest: .dev/worker-override-clear.yaml
    target: tadoku-dev-db.tdk-dev-data/tadoku-${DEV_ROUTE}
    timeout: 5m
    imageName: tenant
    pushTarget: //.dev:tenant_push
    container: tenant
