spec:
  automountServiceAccountToken: false
  serviceAccountName: tadoku-api
  containers:
    - name: tadoku-api
      env:
        - name: API_SCORING_ENGINE_ENABLED
          value: "false"
        - name: API_LEADERBOARD_OUTBOX_ENABLED
          value: "true"
        - name: API_LEADERBOARD_CACHE_PREFIX
          value: "dev:${DEV_ROUTE}:"
        - name: API_PORT
          value: "8000"
        - name: API_METRICS_PORT
          value: "9090"
        - name: API_SERVICE_NAME
          value: tadoku-api
        - name: API_JWKS
          value: http://oathkeeper-api.tdk-dev-oathkeeper:4456/.well-known/jwks.json
        - name: API_OATHKEEPER_URL
          value: http://oathkeeper-proxy.tdk-dev-oathkeeper:4455
        - name: API_FLIPT_URL
          value: http://oathkeeper-proxy.tdk-dev-oathkeeper:4455/flipt
        - name: API_FLIPT_ENABLED
          value: "true"
        - name: API_FLIPT_ENVIRONMENT
          value: local
        - name: API_FLIPT_NAMESPACE
          value: default
        - name: API_FLIPT_UPDATE_INTERVAL
          value: 30s
        - name: API_FLIPT_REQUEST_TIMEOUT
          value: 5s
        - name: API_FLIPT_STARTUP_TIMEOUT
          value: 3s
        - name: API_FLIPT_MANAGEMENT_URL
          value: http://oathkeeper-proxy.tdk-dev-oathkeeper:4455/flipt-management
        - name: API_KETO_READ_URL
          value: http://keto-read.tdk-dev-keto:4466
        - name: API_KETO_WRITE_URL
          value: http://keto-write.tdk-dev-keto:4467
        - name: API_KRATOS_ADMIN_URL
          value: http://kratos-admin.tdk-dev-kratos
        - name: API_OATHKEEPER_AUTHZ_TOKEN
          valueFrom:
            secretKeyRef:
              name: dev-oathkeeper-authz
              key: token
        - name: API_POSTGRES_HOST
          value: tadoku-dev-db.tdk-dev-data
        - name: API_POSTGRES_DATABASE
          value: immersion-${DEV_ROUTE}
        - name: API_POSTGRES_SSLMODE
          value: require
        - name: API_POSTGRES_MAX_CONNECTIONS
          value: "4"
        - name: API_VALKEY_URL
          value: redis://valkey.tdk-dev-data:6379
        - name: API_POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: immersion.tadoku-dev-db.credentials.postgresql.acid.zalan.do
              key: username
        - name: API_POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: immersion.tadoku-dev-db.credentials.postgresql.acid.zalan.do
              key: password
      ports:
        - name: http
          containerPort: 8000
        - name: metrics
          containerPort: 9090
      volumeMounts:
        - name: k8s-token
          mountPath: /var/run/secrets/tokens
          readOnly: true
      readinessProbe:
        httpGet:
          path: /readyz
          port: 8000
        periodSeconds: 1
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: "1"
          memory: 512Mi
  volumes:
    - name: k8s-token
      projected:
        sources:
          - serviceAccountToken:
              path: token
              expirationSeconds: 3600
              audience: tadoku-api
