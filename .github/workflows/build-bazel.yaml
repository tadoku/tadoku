name: build-bazel

on:
  schedule:
    # monthly at 5th of every month
    - cron: "0 0 5 * *"

  workflow_dispatch:
    inputs:
      runner:
        description: Runner for an equivalent-workload benchmark
        type: choice
        default: tadoku-ci
        options:
          - tadoku-ci
          - ubuntu-latest
  pull_request:
    paths:
      - "services/**"
      - "tools/ci/**"
      - "tools/bazel"
      - "tools/oapi-codegen/**"
      - ".depolicy.yaml"
      - "**/BUILD"
      - "**/BUILD.bazel"
      - "**/*.bzl"
      - ".bazelversion"
      - ".bazelrc"
      - "REPO.bazel"
      - "MODULE.bazel"
      - "MODULE.bazel.lock"
      - "go.mod"
      - "go.sum"
      - "scripts/check-tadoku-api-visibility.sh"
      - "scripts/generate-openapi.sh"
      - ".github/workflows/build-bazel.yaml"
      - "!frontend/**"
  push:
    branches: [main]
    paths:
      - "services/**"
      - "tools/ci/**"
      - "tools/bazel"
      - "tools/oapi-codegen/**"
      - ".depolicy.yaml"
      - "**/BUILD"
      - "**/BUILD.bazel"
      - "**/*.bzl"
      - ".bazelversion"
      - ".bazelrc"
      - "REPO.bazel"
      - "MODULE.bazel"
      - "MODULE.bazel.lock"
      - "go.mod"
      - "go.sum"
      - "scripts/check-tadoku-api-visibility.sh"
      - "scripts/generate-openapi.sh"
      - ".github/workflows/build-bazel.yaml"
      - "!frontend/**"

permissions:
  contents: read

concurrency:
  group: build-bazel-${{ github.event.pull_request.number || github.ref }}-${{ inputs.runner || 'default' }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Tadoku
    runs-on: ${{ inputs.runner || ((github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'tadoku-ci' || 'ubuntu-latest') }}
    permissions:
      contents: read
      packages: write
    env:
      TADOKU_TEST_POSTGRES_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres?sslmode=disable
      TADOKU_TEST_PGBOUNCER_URL: postgres://postgres:postgres@127.0.0.1:6432/postgres?sslmode=disable
      TADOKU_TEST_VALKEY_URL: redis://127.0.0.1:6379
    services:
      postgres:
        image: postgres:17@sha256:b8faeff7712663c2773a190181e1246e37e364b887611c04658c28b44e2408fe
        env:
          POSTGRES_DB: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      pgbouncer:
        image: edoburu/pgbouncer:v1.25.2-p0@sha256:7d7a27d9e90985cab5cf42256f5c13a3120baa4b055b69df37beb272b89b2340
        env:
          DB_HOST: postgres
          DB_PORT: 5432
          DB_USER: postgres
          DB_PASSWORD: postgres
          AUTH_TYPE: scram-sha-256
          POOL_MODE: transaction
          LISTEN_PORT: 6432
          MAX_CLIENT_CONN: 1000
          DEFAULT_POOL_SIZE: 5
          MAX_PREPARED_STATEMENTS: 200
        ports:
          - 6432:6432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -p 6432 -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      valkey:
        image: valkey/valkey:9@sha256:418652cfb58ef879d4978c33553735d7147016032d5aefaa14c828e611eb9dfd
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 2

      # Hosted isolation is retained for fork PRs and the benchmark control.
      - name: Setup hosted Bazel
        if: runner.environment == 'github-hosted'
        uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0

      - name: Configure private Bazel cache and resource budget
        if: runner.environment == 'self-hosted'
        env:
          UPLOAD_RESULTS: ${{ github.event_name != 'pull_request' }}
        run: |
          cat > "$HOME/.bazelrc" <<EOF
          startup --output_user_root=$RUNNER_TEMP/bazel
          common --remote_cache=https://bazel-cache.lab
          common --tls_certificate=/usr/local/share/ca-certificates/ca.crt
          common --remote_timeout=5s
          common --remote_retries=1
          build --remote_upload_local_results=$UPLOAD_RESULTS
          build --jobs=3
          test --local_test_jobs=2
          build --local_resources=memory=2048
          EOF
          curl --fail --silent --show-error \
            --cacert /usr/local/share/ca-certificates/ca.crt \
            https://bazel-cache.lab/status | tee "$RUNNER_TEMP/bazel-cache-before.json"

      - name: Ensure wrapper verification tools
        run: |
          if ! command -v fuser >/dev/null; then
            sudo apt-get update --quiet
            sudo apt-get install --yes --no-install-recommends psmisc
          fi
          fuser --version

      - name: Verify safe Bazel execution
        run: python3 tools/ci/check_bazel_wrapper.py --evidence-dir "$RUNNER_TEMP/bazel-wrapper"

      - name: Verify image publication authentication
        run: python3 tools/ci/check_bazel_publish.py --evidence-dir "$RUNNER_TEMP/bazel-publish"

      - name: Retain Bazel wrapper evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bazel-wrapper-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/bazel-wrapper/*.json
            ${{ runner.temp }}/bazel-wrapper/commands.jsonl
            ${{ runner.temp }}/bazel-wrapper/*.log
            ${{ runner.temp }}/bazel-publish/result.json
            ${{ runner.temp }}/bazel-publish/*.log
          retention-days: 7

      - name: Verify frozen Bazel dependencies
        run: bazel mod deps --lockfile_mode=error

      - name: Check changed forward migrations for risky SQL
        if: github.event_name == 'pull_request'
        run: |
          git diff --name-only --diff-filter=ACMR HEAD^1 HEAD -- services/tadoku-api/migrations/ > "$RUNNER_TEMP/changed-migrations"
          mapfile -t migrations < <(sed -n '/\.up\.sql$/p' "$RUNNER_TEMP/changed-migrations")
          if ((${#migrations[@]})); then
            bazel run --lockfile_mode=error //tools/ci/migrationsafety/cmd -- "${migrations[@]}"
          fi

      - name: Verify Gazelle
        run: bazel run --lockfile_mode=error //:gazelle -- -mode=diff

      - name: Verify Tadoku API Go library visibility
        run: ./scripts/check-tadoku-api-visibility.sh

      - name: Verify Tadoku API provider dependencies
        run: ./tools/ci/check_tadoku_api_provider_deps.sh

      - name: Verify Tadoku API import policies (including test files)
        run: bazel run --lockfile_mode=error //tools/ci/depolicy

      - name: Verify Tadoku API repository policies
        run: bazel run --lockfile_mode=error //tools/ci/repopolicy

      - name: Verify Go comment policy
        run: bazel run --lockfile_mode=error //tools/ci/commentpolicy

      - name: Expose Bazel Go SDK for OpenAPI formatting
        run: |
          go_root="$(bazel run --lockfile_mode=error @rules_go//go -- env GOROOT)"
          test -x "$go_root/bin/go"
          printf '%s/bin\n' "$go_root" >> "$GITHUB_PATH"

      - name: Verify Tadoku API OpenAPI generation
        run: |
          ./scripts/generate-openapi.sh
          git diff --exit-code -- services/tadoku-api/spec/openapi.yaml services/tadoku-api/generated/openapi

      - name: Check load_images covers all production oci_load targets
        run: |
          diff \
            <(bazel query --lockfile_mode=error 'attr(name, "^load$", kind("oci_load", //services/...))' | sort) \
            <(bazel query --lockfile_mode=error 'kind("oci_load", labels(data, //:load_images))' | sort) \
          || { echo "//:load_images is out of sync with production oci_load targets named :load under //services/..." >&2; exit 1; }

      - name: Check push_images covers all production oci_push targets
        run: |
          diff \
            <(bazel query --lockfile_mode=error 'attr(name, "^push$", kind("oci_push", //services/...))' | sort) \
            <(bazel query --lockfile_mode=error 'kind("oci_push", labels(data, //:push_images))' | sort) \
          || { echo "//:push_images is out of sync with production oci_push targets named :push under //services/..." >&2; exit 1; }

      - name: Build and run tests
        id: tests
        run: bazel test --lockfile_mode=error --nobuild_tests_only --test_output=errors --profile="$RUNNER_TEMP/bazel-tests.profile" --build_event_json_file="$RUNNER_TEMP/bazel-tests.json" //...

      - name: Retain HTTP E2E diagnostics after test failure
        if: failure() && steps.tests.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: http-e2e-${{ github.job }}-${{ github.run_attempt }}
          path: |
            bazel-testlogs/services/tadoku-api/e2e/e2e_test/test.log
            bazel-testlogs/services/tadoku-api/e2e/e2e_test/test.xml
          retention-days: 7

      - name: Show PgBouncer regression evidence
        run: cat bazel-testlogs/services/tadoku-api/infra/postgres/pgbouncer_test/test.log

      - name: Race-test Tadoku API and helpers
        id: race
        run: >-
          bazel test --lockfile_mode=error --test_output=errors --@rules_go//go/config:race
          --profile="$RUNNER_TEMP/bazel-race.profile"
          --build_event_json_file="$RUNNER_TEMP/bazel-race.json"
          //services/tadoku-api/internal/permissions:permissions_test
          //services/tadoku-api/internal/timex:timex_test
          //services/tadoku-api/infra/postgres:postgres_test
          //services/tadoku-api/infra/postgres:pgbouncer_test
          //services/tadoku-api/infra/valkey:valkey_test
          //services/tadoku-api/app/worker:worker_test
          //services/tadoku-api/features/announcements:announcements_test
          //services/tadoku-api/features/audit:audit_test
          //services/tadoku-api/features/authz:authz_test
          //services/tadoku-api/features/pages:pages_test
          //services/tadoku-api/features/profile:profile_test
          //services/tadoku-api/features/posts:posts_test
          //services/tadoku-api/e2e:e2e_test
          //services/tadoku-api/cmd/tadoku-api:tadoku-api_test
          //services/tadoku-api/transport/http:http_test

      - name: Retain race diagnostics
        if: failure() && steps.race.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: http-e2e-race-${{ github.run_attempt }}
          path: |
            bazel-testlogs/services/tadoku-api/e2e/e2e_test/test.log
            bazel-testlogs/services/tadoku-api/e2e/e2e_test/test.xml
          retention-days: 7

      - name: Print release image digests
        run: |
          targets='set(//services/tadoku-api:image //services/tadoku-api/cmd/tadoku-worker:image)'
          bazel build --lockfile_mode=error --config=release //services/tadoku-api:image //services/tadoku-api/cmd/tadoku-worker:image
          while read -r image; do
            printf '%s ' "$image"
            jq -r '.manifests[0].digest' "$image/index.json"
          done < <(bazel cquery --lockfile_mode=error --config=release --output=files "$targets")

      - name: Load backend images for scanning
        if: github.event_name != 'pull_request'
        run: bazel run --lockfile_mode=error --config=release //:load_images

      - name: Install Trivy
        if: github.event_name != 'pull_request'
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.72.0

      - name: Scan backend images
        if: github.event_name != 'pull_request'
        env:
          BACKEND_IMAGES: |
            ghcr.io/tadoku/tadoku/image-webhook-gateway:latest
            ghcr.io/tadoku/tadoku/tadoku-api:latest
            ghcr.io/tadoku/tadoku/tadoku-worker:latest
            ghcr.io/tadoku/tadoku/tadoku-api-migrations:latest
            ghcr.io/tadoku/tadoku/token-reflector:latest
        run: |
          scan_status=0
          while read -r image; do
            [[ -z "${image}" ]] && continue
            trivy image \
              --exit-code 1 \
              --ignore-unfixed \
              --scanners vuln \
              --severity CRITICAL,HIGH \
              "${image}" || scan_status=1
          done <<< "${BACKEND_IMAGES}"
          exit "${scan_status}"

      - name: Publish validated images
        if: github.ref == 'refs/heads/main'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "${{ github.repository_owner }}" --password-stdin
          bazel run --lockfile_mode=error --config=release //:push_images

      - name: Retain CI performance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bazel-performance-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/bazel-*.profile
            ${{ runner.temp }}/bazel-*.json
          retention-days: 7
