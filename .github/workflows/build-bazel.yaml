name: build-bazel
on:
  schedule:
    # monthly at 5th of every month
    - cron: "0 0 5 * *"

  workflow_dispatch:
  push:
    paths:
      - "services/**"
      - "tools/ci/**"
      - "BUILD.bazel"
      - ".bazelversion"
      - ".bazelrc"
      - "MODULE.bazel"
      - "MODULE.bazel.lock"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/build-bazel.yaml"
      - "!frontend/**"
jobs:
  build:
    name: Build Tadoku
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup cache
        uses: actions/cache@v4
        with:
          path: "/home/runner/.cache/bazel"
          key: bazel-v5-${{ runner.os }}-${{ hashFiles('.bazelversion', '.bazelrc', 'MODULE.bazel', 'MODULE.bazel.lock', 'go.mod', 'go.sum') }}

      - name: Verify Gazelle
        run: bazel run //:gazelle -- -mode=diff

      - name: Build
        run: bazel build //...

      - name: Check push_images covers all production oci_push targets
        run: |
          diff \
            <(bazel query 'attr(name, "^push$", kind("oci_push", //services/...))' | sort) \
            <(bazel query 'kind("oci_push", labels(data, //:push_images))' | sort) \
          || { echo "//:push_images is out of sync with production oci_push targets named :push under //services/..." >&2; exit 1; }

      - name: Check load_images covers all production oci_load targets
        run: |
          diff \
            <(bazel query 'filter("^//services/[^/]+:load$", attr(name, "^load$", kind("oci_load", //services/...)))' | sort) \
            <(bazel query 'kind("oci_load", labels(data, //:load_images))' | sort) \
          || { echo "//:load_images is out of sync with production oci_load targets named :load under //services/..." >&2; exit 1; }

      - name: Run tests
        run: bazel test //...

      - name: Load backend images for scanning
        run: bazel run //:load_images

      - name: Install Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.72.0

      - name: Scan backend images
        env:
          BACKEND_IMAGES: |
            ghcr.io/tadoku/tadoku/authz-api:latest
            ghcr.io/tadoku/tadoku/content-api:latest
            ghcr.io/tadoku/tadoku/immersion-api:latest
            ghcr.io/tadoku/tadoku/profile-api:latest
            ghcr.io/tadoku/tadoku/token-reflector:latest
        run: |
          scan_status=0
          while read -r image; do
            [[ -z "${image}" ]] && continue
            trivy image \
              --exit-code 1 \
              --ignore-unfixed \
              --scanners vuln \
              --severity CRITICAL,HIGH \
              "${image}" || scan_status=1
          done <<< "${BACKEND_IMAGES}"
          exit "${scan_status}"

  publish:
    name: Publish Tadoku Images
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup cache
        uses: actions/cache@v4
        with:
          path: "/home/runner/.cache/bazel"
          key: bazel-v5-${{ runner.os }}-${{ hashFiles('.bazelversion', '.bazelrc', 'MODULE.bazel', 'MODULE.bazel.lock', 'go.mod', 'go.sum') }}

      - name: Push images
        run: |
          # Setup credentials for GitHub packages
          mkdir /tmp/docker
          echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u tadoku --password-stdin
          cp /home/runner/.docker/config.json /tmp/docker/config.json

          # Push images
          bazel run //:push_images
