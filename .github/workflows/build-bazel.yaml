name: build-bazel

on:
  schedule:
    # monthly at 5th of every month
    - cron: "0 0 5 * *"

  workflow_dispatch:
  pull_request:
    paths:
      - "services/**"
      - "tools/ci/**"
      - "**/BUILD"
      - "**/BUILD.bazel"
      - "**/*.bzl"
      - ".bazelversion"
      - ".bazelrc"
      - "MODULE.bazel"
      - "MODULE.bazel.lock"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/build-bazel.yaml"
      - "!frontend/**"
  push:
    paths:
      - "services/**"
      - "tools/ci/**"
      - "**/BUILD"
      - "**/BUILD.bazel"
      - "**/*.bzl"
      - ".bazelversion"
      - ".bazelrc"
      - "MODULE.bazel"
      - "MODULE.bazel.lock"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/build-bazel.yaml"
      - "!frontend/**"

permissions:
  contents: read

concurrency:
  group: build-bazel-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Tadoku
    runs-on: ubuntu-latest
    env:
      IMMERSION_TEST_POSTGRES_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # bazel-contrib/setup-bazel 0.19.0
      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86
        with:
          bazelisk-cache: true
          repository-cache: true
          disk-cache: ${{ github.workflow }}
          cache-save: ${{ github.event_name != 'pull_request' }}

      - name: Verify frozen Bazel dependencies
        run: bazel mod deps --lockfile_mode=error

      - name: Verify Gazelle
        run: bazel run --lockfile_mode=error //:gazelle -- -mode=diff

      - name: Build
        run: bazel build --lockfile_mode=error //...

      - name: Check push_images covers all production oci_push targets
        run: |
          diff \
            <(bazel query --lockfile_mode=error 'attr(name, "^push$", kind("oci_push", //services/...))' | sort) \
            <(bazel query --lockfile_mode=error 'kind("oci_push", labels(data, //:push_images))' | sort) \
          || { echo "//:push_images is out of sync with production oci_push targets named :push under //services/..." >&2; exit 1; }

      - name: Check load_images covers all production oci_load targets
        run: |
          diff \
            <(bazel query --lockfile_mode=error 'filter("^//services/[^/]+:load$", attr(name, "^load$", kind("oci_load", //services/...)))' | sort) \
            <(bazel query --lockfile_mode=error 'kind("oci_load", labels(data, //:load_images))' | sort) \
          || { echo "//:load_images is out of sync with production oci_load targets named :load under //services/..." >&2; exit 1; }

      - name: Run tests
        run: bazel test --lockfile_mode=error //...

      - name: Load backend images for scanning
        run: bazel run --lockfile_mode=error //:load_images

      - name: Install Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.72.0

      - name: Scan backend images
        env:
          BACKEND_IMAGES: |
            ghcr.io/tadoku/tadoku/authz-api:latest
            ghcr.io/tadoku/tadoku/content-api:latest
            ghcr.io/tadoku/tadoku/image-webhook-gateway:latest
            ghcr.io/tadoku/tadoku/immersion-api:latest
            ghcr.io/tadoku/tadoku/profile-api:latest
            ghcr.io/tadoku/tadoku/token-reflector:latest
        run: |
          scan_status=0
          while read -r image; do
            [[ -z "${image}" ]] && continue
            trivy image \
              --exit-code 1 \
              --ignore-unfixed \
              --scanners vuln \
              --severity CRITICAL,HIGH \
              "${image}" || scan_status=1
          done <<< "${BACKEND_IMAGES}"
          exit "${scan_status}"

  publish:
    name: Publish Tadoku Images
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # bazel-contrib/setup-bazel 0.19.0
      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86
        with:
          bazelisk-cache: true
          repository-cache: true
          disk-cache: ${{ github.workflow }}

      - name: Verify frozen Bazel dependencies
        run: bazel mod deps --lockfile_mode=error

      - name: Push images
        run: |
          # Setup credentials for GitHub packages
          mkdir /tmp/docker
          echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u tadoku --password-stdin
          cp /home/runner/.docker/config.json /tmp/docker/config.json

          # Push images
          bazel run --lockfile_mode=error //:push_images
