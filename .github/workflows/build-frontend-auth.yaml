name: build-frontend-auth
on:
  schedule:
    # monthly at 10th of every month
    - cron: "0 0 10 * *"

  push:
    paths:
      - "frontend/apps/auth/**"
      - "frontend/packages/ui/**"
      - ".github/workflows/build-frontend-auth.yaml"
      - "frontend/pnpm-lock.yaml"
      - "frontend/Dockerfile"
      - "frontend/.npmrc"
jobs:
  build:
    name: Build auth
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3

      - name: Install Node.js
        uses: actions/setup-node@3235b876344d2a9aa001b8d1453c930bba69e610 # v3
        with:
          node-version: 20

      - uses: pnpm/action-setup@v2
        name: Install pnpm
        id: pnpm-install
        with:
          version: 10.10.0
          run_install: false

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - uses: actions/cache@6f8efc29b200d32929f49075959781ed54ec270c # v3
        name: Setup pnpm cache
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install

      - name: Build project
        run: pnpm --filter auth run build

  publish:
    name: Publish Image
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/dev/')
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Build image
        run: |
          docker build \
            --build-arg PROJECT_NAME=auth \
            -t ghcr.io/tadoku/tadoku/frontend-auth:${GITHUB_SHA} \
            .

      - name: Push images
        env:
          IMAGE_NAME: ghcr.io/tadoku/tadoku/frontend-auth
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" |
            docker login ghcr.io -u tadoku --password-stdin
          docker push "${IMAGE_NAME}:${GITHUB_SHA}"
          if [ "$GITHUB_REF" = refs/heads/main ]; then
            docker tag "${IMAGE_NAME}:${GITHUB_SHA}" "${IMAGE_NAME}:latest"
            docker tag "${IMAGE_NAME}:${GITHUB_SHA}" "${IMAGE_NAME}:prod"
            docker push "${IMAGE_NAME}:latest"
            docker push "${IMAGE_NAME}:prod"
          fi
