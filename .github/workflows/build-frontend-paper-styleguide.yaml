name: build-frontend-paper-styleguide

on:
  workflow_dispatch:
    inputs:
      publish_production:
        description: Publish the production image after owner approval
        type: boolean
        default: false
        required: true
  pull_request:
    paths:
      - "frontend/apps/paper-styleguide/**"
      - "frontend/packages/paper-ui/**"
      - "frontend/scripts/check-paper-boundaries.mjs"
      - "frontend/scripts/check-paper-boundaries.test.mjs"
      - "frontend/scripts/smoke-paper-image.sh"
      - "frontend/paper-boundaries.json"
      - "frontend/package.json"
      - "frontend/pnpm-workspace.yaml"
      - "frontend/pnpm-lock.yaml"
      - "frontend/.npmrc"
      - "frontend/.dockerignore"
      - ".github/workflows/build-frontend-paper-styleguide.yaml"
  push:
    branches: [main]
    paths:
      - "frontend/apps/paper-styleguide/**"
      - "frontend/packages/paper-ui/**"
      - "frontend/scripts/check-paper-boundaries.mjs"
      - "frontend/scripts/check-paper-boundaries.test.mjs"
      - "frontend/scripts/smoke-paper-image.sh"
      - "frontend/paper-boundaries.json"
      - "frontend/package.json"
      - "frontend/pnpm-workspace.yaml"
      - "frontend/pnpm-lock.yaml"
      - "frontend/.npmrc"
      - "frontend/.dockerignore"
      - ".github/workflows/build-frontend-paper-styleguide.yaml"

concurrency:
  group: paper-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  boundaries:
    name: paper / boundaries
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.10.0
          run_install: false
      - run: pnpm check:paper-boundaries
        working-directory: frontend
      - run: node --test scripts/check-paper-boundaries.test.mjs
        working-directory: frontend

  quality:
    name: paper / quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.10.0
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: pnpm --filter paper-ui lint
        working-directory: frontend
      - run: pnpm --filter paper-ui typecheck
        working-directory: frontend
      - run: pnpm --filter paper-ui test
        working-directory: frontend
      - run: pnpm --filter paper-ui build
        working-directory: frontend
      - run: pnpm --filter paper-ui examples:check
        working-directory: frontend
      - run: pnpm --filter paper-ui consumer:ts49
        working-directory: frontend
      - run: pnpm --filter paper-ui pack:check
        working-directory: frontend
      - run: pnpm --filter paper-styleguide lint
        working-directory: frontend
      - run: pnpm --filter paper-styleguide typecheck
        working-directory: frontend
      - run: pnpm --filter paper-styleguide test
        working-directory: frontend
      - run: pnpm --filter paper-styleguide build
        working-directory: frontend

  static-image:
    name: paper / static image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build production image
        run: docker build -f apps/paper-styleguide/Dockerfile -t paper-styleguide:ci .
        working-directory: frontend
      - name: Smoke production image
        run: ./scripts/smoke-paper-image.sh paper-styleguide:ci
        working-directory: frontend

  publish:
    name: paper / publish
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: [boundaries, quality, static-image]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish immutable Paper image
        id: image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: frontend
          file: frontend/apps/paper-styleguide/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/tadoku/tadoku/frontend-paper-styleguide:${{ github.sha }}
            ghcr.io/tadoku/tadoku/frontend-paper-styleguide:latest
      - name: Publish production tag after approval
        if: github.event_name == 'workflow_dispatch' && inputs.publish_production
        run: |
          docker buildx imagetools create --tag ghcr.io/tadoku/tadoku/frontend-paper-styleguide:prod \
            ghcr.io/tadoku/tadoku/frontend-paper-styleguide@${{ steps.image.outputs.digest }}
      - name: Record release identity
        run: |
          echo "### Tadoku Paper image" >> "$GITHUB_STEP_SUMMARY"
          echo "- Source: \`${GITHUB_SHA}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Digest: \`${{ steps.image.outputs.digest }}\`" >> "$GITHUB_STEP_SUMMARY"
