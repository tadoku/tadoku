name: build-frontend-webv2
on:
  workflow_dispatch:
    inputs:
      publish_production:
        description: Publish the production image after owner approval
        type: boolean
        default: false
        required: true
  schedule:
    # monthly at 10th of every month
    - cron: "0 0 10 * *"

  push:
    paths:
      - "frontend/apps/webv2/**"
      - "frontend/packages/ui/**"
      - ".github/workflows/build-frontend-webv2.yaml"
      - "frontend/pnpm-lock.yaml"
      - "frontend/Dockerfile"
      - "frontend/scripts/publish-image.sh"
      - "frontend/scripts/check-publish-image.py"
      - "frontend/.npmrc"
jobs:
  build:
    name: Build webv2
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3

      - name: Check committed-tree image publication
        run: python3 scripts/check-publish-image.py

      - name: Install Node.js
        uses: actions/setup-node@3235b876344d2a9aa001b8d1453c930bba69e610 # v3
        with:
          node-version: 20

      - uses: pnpm/action-setup@v2
        name: Install pnpm
        id: pnpm-install
        with:
          version: 10.10.0
          run_install: false

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@6f8efc29b200d32929f49075959781ed54ec270c # v3
        name: Setup pnpm cache
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install

      - name: Build project
        run: pnpm --filter webv2 run build

  publish:
    name: Publish Image
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/dev/')
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Publish images
        env:
          PUBLISH_PRODUCTION: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_production }}
          IMAGE_NAME: ghcr.io/tadoku/tadoku/frontend-webv2
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" |
            docker login ghcr.io -u tadoku --password-stdin
          tags=(--tag "$GITHUB_SHA")
          if [ "$GITHUB_REF" = refs/heads/main ]; then
            tags+=(--tag latest)
          fi
          if [ "$GITHUB_REF" = refs/heads/main ] && [ "$PUBLISH_PRODUCTION" = true ]; then
            tags+=(--tag prod)
          fi
          ./scripts/publish-image.sh webv2 --repository "$IMAGE_NAME" "${tags[@]}"
