name: deploy-docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "services/tadoku-api/spec/**"
      - ".github/workflows/deploy-docs.yaml"
  pull_request:
    paths:
      - "docs/**"
      - "services/tadoku-api/spec/**"
      - ".github/workflows/deploy-docs.yaml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          package_json_file: docs/package.json

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: docs/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: docs
        run: pnpm install --frozen-lockfile

      - name: Verify generated API reference
        working-directory: docs
        run: pnpm api:check

      - name: Typecheck
        working-directory: docs
        run: pnpm typecheck

      - name: Build
        working-directory: docs
        run: pnpm build

      - name: Verify public API publication boundary
        working-directory: docs
        shell: bash
        run: |
          endpoint_count="$(find docs/api -name '*.api.mdx' | wc -l | tr -d ' ')"
          page_count="$(find build/api -name index.html | wc -l | tr -d ' ')"

          test "$endpoint_count" = "68"
          test "$page_count" = "73"

          if rg -n 'internal-api|/internal/v1/|authz-api:8080|profile-api:8080' docs/api build/api; then
            echo "Internal API content was found in the public API reference" >&2
            exit 1
          fi

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: docs/build

  deploy:
    if: github.event_name != 'pull_request'
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
