name: verify-frontend-api-client

on:
  pull_request:
    paths:
      - "services/tadoku-api/spec/openapi.yaml"
      - "services/tadoku-api/e2e/testdata/**"
      - "frontend/packages/api-client/**"
      - "frontend/package.json"
      - "frontend/pnpm-workspace.yaml"
      - "frontend/pnpm-lock.yaml"
      - "frontend/.npmrc"
      - ".github/workflows/verify-frontend-api-client.yaml"
  push:
    branches: [main]
    paths:
      - "services/tadoku-api/spec/openapi.yaml"
      - "services/tadoku-api/e2e/testdata/**"
      - "frontend/packages/api-client/**"
      - "frontend/package.json"
      - "frontend/pnpm-workspace.yaml"
      - "frontend/pnpm-lock.yaml"
      - "frontend/.npmrc"
      - ".github/workflows/verify-frontend-api-client.yaml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify generated frontend API client
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.10.0
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --filter api-client...
        working-directory: frontend
      - name: Verify generated code is current
        run: |
          pnpm --filter api-client check:generated || {
            echo "::error::The frontend API client is out of date. Run pnpm --filter api-client generate in frontend/ and commit the complete output."
            exit 1
          }
        working-directory: frontend
      - run: pnpm --filter api-client typecheck && pnpm --filter api-client test
        working-directory: frontend
