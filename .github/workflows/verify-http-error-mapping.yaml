name: verify-http-error-mapping

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify tadoku-api handlers use the shared error mapping
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Reject literal 5xx handler responses
        run: |
          # Handlers return errors; transport/http/errors.go alone maps them to 5xx statuses.
          if grep -rnE '5[0-9]{2}[A-Za-z]*Response\{' services/tadoku-api/transport/http --include='*.go'; then
            echo "::error::Return the error from the handler and let transport/http/errors.go choose the status."
            exit 1
          fi
