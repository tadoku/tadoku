name: webv3-production-canary

# Signed-in journey against next.tadoku.app. See docs/docs/frontend/webv3-production-canary.md.

on:
  schedule:
    # Hourly, the Image Updater's interval, so each production sync is followed by a run.
    # GitHub starts this repository's schedules late and can skip them.
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: webv3-production-canary
  cancel-in-progress: false

jobs:
  canary:
    name: Sign in and walk Webv3 production
    # Scheduled workflows and dispatches run from main; a dispatch from another branch must not reach the credentials.
    if: vars.WEBV3_CANARY_ENABLED == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      journey: ${{ steps.journey.outcome }}
    environment:
      name: production-canary
      deployment: false
    env:
      WEBV3_BASE_URL: https://next.tadoku.app
      TADOKU_API_URL: https://tadoku.app/api/internal
    steps:
      # The spec skips, and Playwright exits green, when the credentials are unset.
      - name: Require the canary credentials
        env:
          E2E_READER_EMAIL: ${{ secrets.WEBV3_CANARY_EMAIL }}
          E2E_READER_PASSWORD: ${{ secrets.WEBV3_CANARY_PASSWORD }}
        run: test -n "$E2E_READER_EMAIL" && test -n "$E2E_READER_PASSWORD"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.10.0
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --filter webv3...
        working-directory: frontend
      - run: pnpm --filter webv3 exec playwright install chromium
        working-directory: frontend
      # One retry so a pod replaced mid-run does not page anyone; a broken release fails both attempts.
      - id: journey
        run: pnpm --filter webv3 exec playwright test e2e/production-canary.spec.ts --retries=1
        working-directory: frontend
        env:
          E2E_READER_EMAIL: ${{ secrets.WEBV3_CANARY_EMAIL }}
          E2E_READER_PASSWORD: ${{ secrets.WEBV3_CANARY_PASSWORD }}
          PLAYWRIGHT_OUTPUT_DIR: ${{ runner.temp }}/webv3-canary
      # Failure screenshots only: the HTML report records typed values, including the password.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: webv3-production-canary-${{ github.run_attempt }}
          path: ${{ runner.temp }}/webv3-canary/results
          retention-days: 7

  report:
    name: Report the canary result
    needs: canary
    if: always() && needs.canary.result != 'skipped'
    # Notify accepts producers only from inside the homelab cluster.
    runs-on: tadoku-ci
    timeout-minutes: 5
    steps:
      # Red opens an SRE incident, so only the journey's own result counts, not a failed checkout or install.
      # Before Notify, so a Notify outage cannot hide a red run from the canary alert. Contract:
      # antonve/homelab docs/runbooks/tadoku-web-alerts.md#canary-signal-contract
      - name: Publish green or red to the alert gauges
        if: needs.canary.outputs.journey == 'success' || needs.canary.outputs.journey == 'failure'
        env:
          JOURNEY: ${{ needs.canary.outputs.journey }}
        run: |
          if test "$JOURNEY" = success; then value=1; else value=0; fi
          seconds=$(date +%s)
          jq --null-input --compact-output \
            --arg nanos "${seconds}000000000" \
            --argjson seconds "$seconds" \
            --argjson value "$value" \
            '{resourceMetrics: [{
              resource: {attributes: [
                {key: "service.name", value: {stringValue: "webv3-production-canary"}},
                {key: "service.namespace", value: {stringValue: "tadoku"}},
                {key: "deployment.environment.name", value: {stringValue: "production"}}
              ]},
              scopeMetrics: [{metrics: [
                {name: "tadoku_webv3_canary_success", gauge: {dataPoints: [{timeUnixNano: $nanos, asDouble: $value}]}},
                {name: "tadoku_webv3_canary_last_run_timestamp_seconds",
                  gauge: {dataPoints: [{timeUnixNano: $nanos, asDouble: $seconds}]}}
              ]}]
            }]}' |
            curl --fail-with-body --silent --show-error --max-time 10 --retry 2 --retry-all-errors \
              --header 'Content-Type: application/json' --data @- \
              http://alloy.monitoring.svc.cluster.local:4318/v1/metrics
      - name: Publish green or red to Notify
        if: always()
        env:
          RESULT: ${{ needs.canary.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}
          EVENT: ${{ github.event_name }}
        run: |
          if test "$RESULT" = success; then state=green severity=info; else state=red severity=critical; fi
          body="Result: $RESULT. Signed-in journey on next.tadoku.app ($EVENT), workflow revision $GITHUB_SHA."
          echo "### Webv3 production canary: $state ($RESULT)" >> "$GITHUB_STEP_SUMMARY"
          jq --null-input --compact-output \
            --arg title "Webv3 production canary $state" \
            --arg severity "$severity" \
            --arg body "$body" \
            --arg link "$RUN_URL" \
            '{topic: "webv3-production-canary", severity: $severity, title: $title, body: $body, link: $link}' |
            curl --fail-with-body --silent --show-error --max-time 10 --retry 2 --retry-all-errors \
              --header 'Content-Type: application/json' --data @- \
              http://notify.notify.svc.cluster.local/v1/notifications ||
            { echo "::error::Notify did not accept the canary result; see the workflow run instead."; exit 1; }
