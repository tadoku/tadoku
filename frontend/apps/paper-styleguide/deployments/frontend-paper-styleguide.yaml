apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-paper-styleguide
  labels:
    app: frontend-paper-styleguide
spec:
  selector:
    matchLabels:
      app: frontend-paper-styleguide
  template:
    metadata:
      labels:
        app: frontend-paper-styleguide
        tier: web
    spec:
      containers:
      - name: frontend-paper-styleguide
        image: frontend-paper-styleguide
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5173
        env:
        - name: HOST
          value: 0.0.0.0
        - name: PORT
          value: "5173"
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-paper-styleguide
  labels:
    app: frontend-paper-styleguide
spec:
  ports:
    - port: 5173
      targetPort: 5173
      protocol: TCP
  selector:
    app: frontend-paper-styleguide
