oathkeeper:
  config:
    log:
      level: debug
      format: json
      leak_sensitive_values: true

    serve:
      proxy:
        trust_forwarded_headers: true
        cors:
          enabled: true
          allowed_origins:
            - "{{TADOKU_APP_URL}}"
            - "{{TADOKU_AUTH_URL}}"
            - "{{TADOKU_ADMIN_URL}}"
          allowed_methods:
            - POST
            - GET
            - PUT
            - PATCH
            - DELETE
          allowed_headers:
            - Authorization
            - Content-Type
          exposed_headers:
            - Content-Type
          allow_credentials: true
          debug: true

    errors:
      fallback:
        - json

      handlers:
        redirect:
          enabled: true
          config:
            to: "{{TADOKU_AUTH_URL}}/"
            when:
              -
                error:
                  - unauthorized
                  - forbidden
                request:
                  header:
                    accept:
                      - text/html
        json:
          enabled: true
          config:
            verbose: true

    access_rules:
      matching_strategy: glob

    authenticators:
      anonymous:
        enabled: true
        config:
          subject: guest

      cookie_session:
        enabled: true
        config:
          check_session_url: http://kratos-public/sessions/whoami
          preserve_path: true
          extra_from: "@this"
          subject_from: "identity.id"
          only:
            - ory_kratos_session

      jwt:
        enabled: true
        config:
          jwks_urls:
            - http://token-reflector.tdk-token-reflector/jwks

      noop:
        enabled: true

    authorizers:
      allow:
        enabled: true

      remote_json:
        enabled: true
        config:
          # Per-rule settings override this schema-required, fail-closed fallback.
          remote: http://127.0.0.1
          payload: '{}'

    mutators:
      noop:
        enabled: true

      id_token:
        enabled: true
        config:
          issuer_url: http://oathkeeper-api/
          jwks_url: file:///etc/secrets/oathkeeper/jwks.json
          claims: |
            {
              "type": "user",
              "session": {{ .Extra | toJson }}
            }

deployment:
  automountServiceAccountToken: false
  extraEnv:
    - name: OATHKEEPER_AUTHZ_TOKEN
      valueFrom:
        secretKeyRef:
          name: dev-oathkeeper-authz
          key: token
  extraVolumes:
    - name: jwks
      secret:
        secretName: dev-oathkeeper-jwks
  extraVolumeMounts:
    - name: jwks
      mountPath: /etc/secrets/oathkeeper
      readOnly: true
