apiVersion: apps/v1
kind: Deployment
metadata:
  name: mailhog
spec:
  replicas: 1
  selector:
    matchLabels: {app: mailhog}
  template:
    metadata:
      labels: {app: mailhog}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: mailhog
          image: docker.io/mailhog/mailhog:v1.0.1
          ports:
            - {name: smtp, containerPort: 1025}
            - {name: http, containerPort: 8025}
          readinessProbe:
            httpGet: {path: /, port: http}
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 100m, memory: 64Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: mailhog
spec:
  selector: {app: mailhog}
  ports:
    - {name: smtp, port: 1025, targetPort: smtp}
    - {name: http, port: 8025, targetPort: http}
