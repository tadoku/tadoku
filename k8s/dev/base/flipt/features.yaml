version: "1.6"
namespace:
  key: default
  name: Default
flags:
  - key: release-webv3
    name: Release webv3
    type: BOOLEAN_FLAG_TYPE
    description: Control access to the webv3 rollout.
    enabled: false
    rollouts:
      - description: Enabled for explicitly granted users.
        segment:
          keys:
            - release-webv3-access
          operator: OR_SEGMENT_OPERATOR
          value: true
segments:
  - key: release-webv3-access
    name: Release webv3 access
    description: Account UUIDs explicitly granted access to release webv3.
    match_type: ALL_MATCH_TYPE
    constraints:
      - type: ENTITY_ID_COMPARISON_TYPE
        property: entityId
        operator: isoneof
        value: []
