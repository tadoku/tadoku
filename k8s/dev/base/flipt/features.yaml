version: "1.6"
namespace:
  key: default
  name: Default
flags:
  - key: release-webv3
    name: Webv3 preview
    type: BOOLEAN_FLAG_TYPE
    description: Enable the Webv3 preview. Disabled for everyone by default.
    enabled: false
    rollouts:
      - description: Enabled for explicitly granted users.
        segment:
          keys:
            - release-webv3-access
          operator: OR_SEGMENT_OPERATOR
          value: true
segments:
  - key: release-webv3-access
    name: Webv3 preview access
    description: Native account IDs explicitly granted Webv3 preview access.
    match_type: ALL_MATCH_TYPE
    constraints:
      - type: ENTITY_ID_COMPARISON_TYPE
        property: entityId
        operator: isoneof
        value: []
