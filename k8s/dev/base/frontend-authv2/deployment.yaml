apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-authv2
  annotations:
    argocd.argoproj.io/sync-wave: "30"
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: frontend-authv2
  template:
    metadata:
      labels:
        app: frontend-authv2
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: frontend-authv2
          image: ghcr.io/tadoku/tadoku/frontend-authv2:latest
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: tadoku-cli-authv2
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            timeoutSeconds: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 50m
              memory: 160Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: ca
              mountPath: /etc/dev-ca
              readOnly: true
      volumes:
        - name: ca
          configMap:
            name: tadoku-cli-ca
