apiVersion: v1
kind: Service
metadata:
  name: frontend-authv2
spec:
  selector:
    app: frontend-authv2
  ports:
    - name: http
      port: 3000
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: dev-cli-gateway
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  type: ExternalName
  externalName: dev-cli-playground-gateway.envoy-gateway-system.svc.cluster.local
  ports:
    - name: http
      port: 80
      targetPort: 80
