apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tadoku-web
  namespace: tdk-dev-routing
  annotations:
    argocd.argoproj.io/sync-wave: "50"
    cert-manager.io/cluster-issuer: lab-ca-acme
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: nginx
  tls:
    - hosts: [tadoku.dev.lab]
      secretName: tadoku-web-tls
  rules:
    - host: tadoku.dev.lab
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: dev-cli-gateway
                port: {number: 80}
---
