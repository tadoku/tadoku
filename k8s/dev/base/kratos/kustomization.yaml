apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: tdk-dev-kratos
resources:
  - namespace.yaml
  - deployment.yaml
  - service.yaml
configMapGenerator:
  - name: kratos-config
    options:
      annotations:
        argocd.argoproj.io/sync-wave: "-20"
    files:
      - kratos.yaml
      - identity.default.schema.json
