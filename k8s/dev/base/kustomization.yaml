# DEVELOPMENT ONLY: homelab-talos-dev. Never use this root for production.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
labels:
  - pairs:
      app.kubernetes.io/part-of: tadoku-dev
    includeSelectors: false
resources:
  - data
  - migrations
  - services
  - retained-keto-namespace.yaml
  - oathkeeper
  - flipt
  - frontend-webv2
  - frontend-webv3
  - frontend-authv2
  - frontend-admin
  - routing
  - ingress.yaml
configMapGenerator:
  - name: frontend-runtime
    namespace: tdk-dev-frontend-webv2
    files: [frontend-start.cjs, ca.crt=lab-root-ca.crt]
  - name: frontend-runtime
    namespace: tdk-dev-frontend-admin
    files: [frontend-start.cjs, ca.crt=lab-root-ca.crt]
  - name: tadoku-cli-ca
    namespace: tdk-dev-frontend-webv3
    options:
      disableNameSuffixHash: true
    files: [ca.crt=lab-root-ca.crt]
  - name: tadoku-cli-webv3
    namespace: tdk-dev-frontend-webv3
    options:
      disableNameSuffixHash: true
    literals:
      - TADOKU_WEB_URL=https://tadoku.dev.lab
      - TADOKU_API_URL=https://tadoku.dev.lab/api/internal
      - NODE_EXTRA_CA_CERTS=/etc/dev-ca/ca.crt
      - NODE_OPTIONS=--max-old-space-size=384
  - name: tadoku-cli-authv2
    namespace: tdk-dev-frontend-auth
    options:
      disableNameSuffixHash: true
    literals:
      - TADOKU_WEB_URL=https://tadoku.dev.lab
      - TADOKU_API_URL=https://tadoku.dev.lab/api/internal
      - NODE_EXTRA_CA_CERTS=/etc/dev-ca/ca.crt
      - NODE_OPTIONS=--max-old-space-size=384
  - name: tadoku-cli-ca
    namespace: tdk-dev-frontend-webv2
    options:
      disableNameSuffixHash: true
    files: [ca.crt=lab-root-ca.crt]
  - name: tadoku-cli-web
    namespace: tdk-dev-frontend-webv2
    options:
      disableNameSuffixHash: true
    literals:
      - NEXT_PUBLIC_HOME_URL=https://tadoku.dev.lab
      - NEXT_PUBLIC_API_ENDPOINT=/api/internal
      - NEXT_SERVER_API_ENDPOINT=http://oathkeeper-proxy.tdk-dev-oathkeeper:4455/api/internal
      - NEXT_PUBLIC_COOKIE_DOMAIN=.tadoku.dev.lab
      - NEXT_PUBLIC_COOKIE_SECURE=true
      - NEXT_PUBLIC_ADMIN_URL=https://admin.tadoku.dev.lab
      - NODE_EXTRA_CA_CERTS=/etc/dev-ca/ca.crt
      - NODE_OPTIONS=--max-old-space-size=384
  - name: tadoku-cli-ca
    namespace: tdk-dev-frontend-auth
    options:
      disableNameSuffixHash: true
    files: [ca.crt=lab-root-ca.crt]
  - name: tadoku-cli-ca
    namespace: tdk-dev-frontend-admin
    options:
      disableNameSuffixHash: true
    files: [ca.crt=lab-root-ca.crt]
  - name: tadoku-cli-web
    namespace: tdk-dev-frontend-admin
    options:
      disableNameSuffixHash: true
    literals:
      - NEXT_PUBLIC_HOME_URL=https://tadoku.dev.lab
      - NEXT_PUBLIC_API_ENDPOINT=https://tadoku.dev.lab/api/internal
      - NEXT_SERVER_API_ENDPOINT=http://oathkeeper-proxy.tdk-dev-oathkeeper:4455/api/internal
      - NEXT_PUBLIC_COOKIE_DOMAIN=.tadoku.dev.lab
      - NEXT_PUBLIC_COOKIE_SECURE=true
      - NEXT_PUBLIC_ADMIN_URL=https://admin.tadoku.dev.lab
      - NODE_EXTRA_CA_CERTS=/etc/dev-ca/ca.crt
      - NODE_OPTIONS=--max-old-space-size=768
generatorOptions:
  annotations:
    argocd.argoproj.io/sync-wave: "-20"
replacements:
  - source:
      kind: Job
      name: tadoku-api-migrate
      fieldPath: spec.template.spec.containers.[name=migrate].image
    targets:
      - select:
          kind: Deployment
          name: tadoku-api
        fieldPaths:
          - metadata.annotations.[tadoku.app/migration-image]
        options:
          create: true
images:
  - name: tadoku-api-migrations-image
    newName: ghcr.io/tadoku/tadoku/tadoku-api-migrations
    newTag: latest
    digest: sha256:020d44e037aabd6e83d4899d0237feb68b980752e3cb6cc738fb7d21ad9a8ef0
  - name: tadoku-api-image
    newName: ghcr.io/tadoku/tadoku/tadoku-api
    newTag: latest
    digest: sha256:fcbb815676b554c8c15e7ac95db1fc8c52f650dd495ed2a5d8f2476e1c1d96eb
  - name: tadoku-worker-image
    newName: ghcr.io/tadoku/tadoku/tadoku-worker
    newTag: latest
    digest: sha256:2f254b051442b002974bd33d4934dc2a8a828c5dff4151509d571b036f9cb710
  - name: token-reflector-image
    newName: ghcr.io/tadoku/tadoku/token-reflector
    newTag: latest
    digest: sha256:e2f7ee4a8a1fecd33038def1a29b0481b44f811975b271ea9b435de3517b825c
  - name: ghcr.io/tadoku/tadoku/frontend-webv2
    newTag: latest
    newName: ghcr.io/tadoku/tadoku/frontend-webv2
    digest: sha256:e4d9ec60860c80a3ef96873ef4e617d37db313d41b7c52ef4f847a3ceb64a081
  - name: ghcr.io/tadoku/tadoku/frontend-webv3
    newName: ghcr.io/tadoku/tadoku/frontend-webv3
    newTag: latest
    digest: sha256:e43e1f7dc5f07886ddca3c6b5f5931fca6503b76a3847bf0ce077f5184b7a5c5
  - name: ghcr.io/tadoku/tadoku/frontend-admin
    newTag: latest
    newName: ghcr.io/tadoku/tadoku/frontend-admin
    digest: sha256:d63f4b7fdee823f9c951542d1d5266836e3843d40f31a0ca0627a48a3d529f45
  - name: ghcr.io/tadoku/tadoku/frontend-authv2
    newName: ghcr.io/tadoku/tadoku/frontend-authv2
    newTag: latest
    digest: sha256:a9affb726973a6f7134fd4a33583970295a1469aa138af5fc46e53b32e87b624
