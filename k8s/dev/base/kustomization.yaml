    digest: sha256:625a6e5809ab7cd48953a929fd456fc1abd2538ebc0a77f751478533fd363fda
  - name: ghcr.io/tadoku/tadoku/frontend-auth
    newTag: latest
    newName: ghcr.io/tadoku/tadoku/frontend-auth
