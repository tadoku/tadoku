    digest: sha256:abde285278b0827e84c55fa2b1180679355c01c1fe87c079f12abd45db4486fd
  - name: ghcr.io/tadoku/tadoku/frontend-auth
    newTag: latest
    newName: ghcr.io/tadoku/tadoku/frontend-auth
