# DEVELOPMENT ONLY: homelab-dev. Never use this root for production.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
labels:
  - pairs:
      app.kubernetes.io/part-of: tadoku-dev
    includeSelectors: false
resources:
  - data
  - migrations
  - services
  - kratos
  - keto
  - oathkeeper
  - flipt
  - frontend-webv2
  - frontend-auth
  - frontend-admin
  - routing
  - ingress.yaml
configMapGenerator:
  - name: keto-migration-config
    namespace: tdk-dev-data
    files: [keto/keto.yaml, keto/namespaces.keto.ts]
  - name: frontend-runtime
    namespace: tdk-dev-frontend-webv2
    files: [frontend-start.cjs, ca.crt=lab-root-ca.crt]
  - name: frontend-runtime
    namespace: tdk-dev-frontend-auth
    files: [frontend-start.cjs, ca.crt=lab-root-ca.crt]
  - name: frontend-runtime
    namespace: tdk-dev-frontend-admin
    files: [frontend-start.cjs, ca.crt=lab-root-ca.crt]
  - name: tadoku-cli-ca
    namespace: tdk-dev-frontend-webv2
    options:
      disableNameSuffixHash: true
    files: [ca.crt=lab-root-ca.crt]
  - name: tadoku-cli-web
    namespace: tdk-dev-frontend-webv2
    options:
      disableNameSuffixHash: true
    literals:
      - NEXT_PUBLIC_KRATOS_INTERNAL_ENDPOINT=http://kratos-public.tdk-dev-kratos
      - NEXT_PUBLIC_KRATOS_ENDPOINT=https://account.tadoku.dev.lab/kratos
      - NEXT_PUBLIC_AUTH_UI_URL=https://account.tadoku.dev.lab
      - NEXT_PUBLIC_HOME_URL=https://tadoku.dev.lab
      - NEXT_PUBLIC_API_ENDPOINT=/api/internal
      - NEXT_SERVER_API_ENDPOINT=https://tadoku.dev.lab/api/internal
      - NEXT_PUBLIC_COOKIE_DOMAIN=.tadoku.dev.lab
      - NEXT_PUBLIC_COOKIE_SECURE=true
      - NEXT_PUBLIC_ADMIN_URL=https://admin.tadoku.dev.lab
      - NODE_EXTRA_CA_CERTS=/etc/dev-ca/ca.crt
      - NODE_OPTIONS=--max-old-space-size=384
generatorOptions:
  annotations:
    argocd.argoproj.io/sync-wave: "-20"
images:
  - name: tadoku-api-migrations-image
    newName: ghcr.io/tadoku/tadoku/tadoku-api-migrations
    newTag: latest
    digest: sha256:7b2a609c06af9d10c3abff6063f74af41faadfb2bfdbd0f004edb6fccdda5496
  - name: tadoku-api-image
    newName: ghcr.io/tadoku/tadoku/tadoku-api
    newTag: latest
    digest: sha256:4e345dd231a226e4396b4babc5f04f2a7fad39295c64a22f7f05d1703d241ce4
  - name: immersion-api-image
    newName: ghcr.io/tadoku/tadoku/immersion-api
    newTag: latest
    digest: sha256:50cc5fd7951259ebb77380171d4aded9f4632db39e1363ef0c31a3666923df5c
  - name: profile-api-image
    newName: ghcr.io/tadoku/tadoku/profile-api
    newTag: latest
    digest: sha256:cb0130f12a0765092c5a7174fb6227882a7355c24c42441fc5d809143eb50cd5
  - name: token-reflector-image
    newName: ghcr.io/tadoku/tadoku/token-reflector
    newTag: latest
    digest: sha256:95c301e39ecce392f235470aed20b5b5bd401e49fec58febceb8c6acd1bc43ec
  - name: ghcr.io/tadoku/tadoku/frontend-webv2
    newTag: latest
    newName: ghcr.io/tadoku/tadoku/frontend-webv2
    digest: sha256:8885f2eef218349213e414e3ba69ce9c0ba27fe1b457f8a4650008928c01652e
  - name: ghcr.io/tadoku/tadoku/frontend-auth
    newTag: latest
    newName: ghcr.io/tadoku/tadoku/frontend-auth
    digest: sha256:024b7161509e501faab8beb4c365a903cc4edf53ae20bf67be8fce787133699a
  - name: ghcr.io/tadoku/tadoku/frontend-admin
    newTag: latest
    newName: ghcr.io/tadoku/tadoku/frontend-admin
