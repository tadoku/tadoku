  - name: content-api-image
    newName: ghcr.io/tadoku/tadoku/content-api
    newTag: latest
    digest: sha256:c21464b50589f2b2077e6973bd24436a922eafcac2d22da4edc2266efdea1b93
  - name: profile-api-image
