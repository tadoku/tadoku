apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: tdk-dev-oathkeeper
resources:
  - namespace.yaml
  - deployment.yaml
  - service.yaml
configMapGenerator:
  - name: oathkeeper-config
    options:
      annotations:
        argocd.argoproj.io/sync-wave: "-20"
    files:
      - oathkeeper.yaml
      - rules.yaml
