- id: tadoku:flipt:operator
  match:
    url: https://flags.tadoku.dev.lab/<**>
    methods:
      - GET
      - POST
      - PUT
      - DELETE
      - PATCH
  authenticators:
    - handler: cookie_session
  authorizer:
    handler: remote_json
    config:
      remote: http://tadoku-api.tdk-dev-tadoku-api/authz/internal/v1/proxy/admin-check
      headers:
        Authorization: Bearer {{ env "OATHKEEPER_AUTHZ_TOKEN" }}
      payload: |
        {
          "subject": "{{ print .Subject }}"
        }
  mutators:
    - handler: noop
  upstream:
    preserve_host: true
    url: http://flipt.tdk-dev-flipt.svc.cluster.local:8080
- id: tadoku:flipt:evaluation:snapshot
  match:
    url: http://oathkeeper-proxy.tdk-dev-oathkeeper:4455/flipt/internal/v1/evaluation/snapshot/namespace/<*>
    methods:
      - GET
  authenticators:
    - handler: jwt
      config:
        jwks_urls:
          - http://oathkeeper-api.tdk-dev-oathkeeper:4456/.well-known/jwks.json
        target_audience:
          - flipt-evaluation
  authorizer:
    handler: allow
  mutators:
    - handler: noop
  upstream:
    preserve_host: false
    url: http://flipt.tdk-dev-flipt.svc.cluster.local:8080
    strip_path: /flipt
- id: s2s:tadoku-to-flipt-evaluation
  match:
    url: http://oathkeeper-proxy.tdk-dev-oathkeeper:4455/token-exchange/flipt-evaluation/tadoku-api
    methods:
      - GET
  authenticators:
    - handler: jwt
      config:
        jwks_urls:
          - http://token-reflector.tdk-dev-token-reflector/jwks
        target_audience:
          - tadoku-api
  authorizer:
    handler: remote_json
    config:
      remote: http://token-reflector.tdk-dev-token-reflector/authorize-service-account
      payload: |
        {
          "subject": {{ .Subject | toJson }},
          "expected_subject": "system:serviceaccount:tdk-dev-tadoku-api:tadoku-api"
        }
  mutators:
    - handler: id_token
      config:
        claims: |
          {
            "type": "service",
            "sub": "{{ .Subject }}",
            "aud": ["flipt-evaluation"]
          }
  upstream:
    url: http://token-reflector.tdk-dev-token-reflector
