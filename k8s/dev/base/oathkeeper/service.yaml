apiVersion: v1
kind: Service
metadata:
  name: oathkeeper-proxy
spec:
  selector:
    app: oathkeeper
  ports:
    - name: http
      port: 4455
      targetPort: 4455
---
apiVersion: v1
kind: Service
metadata:
  name: oathkeeper-api
spec:
  selector:
    app: oathkeeper
  ports:
    - name: http
      port: 4456
      targetPort: 4456
---
apiVersion: v1
kind: Service
metadata:
  name: tadoku-cli-api
spec:
  type: ExternalName
  externalName: dev-cli-playground-gateway.envoy-gateway-system.svc.cluster.local
  ports:
    - name: http
      port: 80
