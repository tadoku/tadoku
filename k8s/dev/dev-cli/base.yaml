    app.kubernetes.io/part-of: tadoku-dev-cli
    dev-cli.io/routing-enabled: "true"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: tadoku-cli-web
  namespace: default
  labels:
    app.kubernetes.io/managed-by: tadoku-dev-cli
    app.kubernetes.io/part-of: tadoku-dev-cli
data:
  NEXT_PUBLIC_KRATOS_INTERNAL_ENDPOINT: http://kratos-public.default
  NEXT_PUBLIC_KRATOS_ENDPOINT: https://account.tadoku.dev.lab/kratos
  NEXT_PUBLIC_AUTH_UI_URL: https://account.tadoku.dev.lab
  NEXT_PUBLIC_HOME_URL: https://tadoku.dev.lab
  NEXT_PUBLIC_API_ENDPOINT: /api/internal
  NEXT_SERVER_API_ENDPOINT: https://tadoku.dev.lab/api/internal
  NEXT_PUBLIC_COOKIE_DOMAIN: .tadoku.dev.lab
  NEXT_PUBLIC_COOKIE_SECURE: "true"
  NEXT_PUBLIC_ADMIN_URL: https://admin.tadoku.dev.lab
  NODE_EXTRA_CA_CERTS: /etc/dev-ca/ca.crt
  NODE_OPTIONS: --max-old-space-size=384
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: tadoku-cli-oathkeeper
  namespace: default
  labels:
    app.kubernetes.io/managed-by: tadoku-dev-cli
    app.kubernetes.io/part-of: tadoku-dev-cli
data:
  config.yaml: |
    log:
      level: info
      format: json
      leak_sensitive_values: false
    serve:
      proxy:
        port: 4455
        trust_forwarded_headers: true
      api:
        port: 4456
    errors:
      fallback:
        - json
      handlers:
        json:
          enabled: true
          config:
            verbose: false
    access_rules:
      matching_strategy: glob
      repositories:
        - file:///etc/rules/rules.yaml
    authenticators:
      anonymous:
        enabled: true
        config:
          subject: guest
      cookie_session:
        enabled: true
        config:
          check_session_url: http://kratos-public.default/sessions/whoami
          preserve_path: true
          extra_from: "@this"
          subject_from: identity.id
          only:
            - ory_kratos_session
    authorizers:
      allow:
        enabled: true
    mutators:
      id_token:
        enabled: true
        config:
          issuer_url: http://oathkeeper-api/
          jwks_url: file:///etc/secrets/oathkeeper/jwks.json
          claims: '{"type":"user","session":{{ .Extra | toJson }}}'
  rules.yaml: |
    - id: dev-content
      upstream:
        preserve_host: false
        url: http://tadoku-cli-api.default.svc.cluster.local
        strip_path: /api/internal
      match:
        url: http://tadoku.dev.lab/api/internal/content/<**>
        methods:
          - GET
          - POST
          - PUT
          - DELETE
          - PATCH
      authenticators:
        - handler: cookie_session
        - handler: anonymous
      authorizer:
        handler: allow
      mutators:
        - handler: id_token
    - id: dev-immersion
      upstream:
        preserve_host: false
        url: http://tadoku-cli-api.default.svc.cluster.local
        strip_path: /api/internal
      match:
        url: http://tadoku.dev.lab/api/internal/immersion/<**>
        methods:
          - GET
          - POST
          - PUT
          - DELETE
          - PATCH
      authenticators:
        - handler: cookie_session
        - handler: anonymous
      authorizer:
        handler: allow
      mutators:
        - handler: id_token
    - id: dev-profile
      upstream:
        preserve_host: false
        url: http://tadoku-cli-api.default.svc.cluster.local
        strip_path: /api/internal
      match:
        url: http://tadoku.dev.lab/api/internal/profile/<**>
        methods:
          - GET
          - POST
          - PUT
          - DELETE
          - PATCH
      authenticators:
        - handler: cookie_session
        - handler: anonymous
      authorizer:
        handler: allow
      mutators:
        - handler: id_token
    - id: dev-authz
      upstream:
        preserve_host: false
        url: http://tadoku-cli-api.default.svc.cluster.local
        strip_path: /api/internal
      match:
        url: http://tadoku.dev.lab/api/internal/authz/<**>
        methods:
          - GET
          - POST
          - PUT
          - DELETE
          - PATCH
      authenticators:
        - handler: cookie_session
        - handler: anonymous
      authorizer:
        handler: allow
      mutators:
        - handler: id_token
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tadoku-cli-oathkeeper
  namespace: default
  labels:
    app.kubernetes.io/managed-by: tadoku-dev-cli
    app.kubernetes.io/part-of: tadoku-dev-cli
spec:
  replicas: 1
  selector:
    matchLabels:
      tadoku.dev/role: cli-oathkeeper
  template:
    metadata:
      labels:
        tadoku.dev/role: cli-oathkeeper
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
      containers:
        - name: oathkeeper
          image: docker.io/oryd/oathkeeper:v26.2.0
          args:
            - serve
            - --config
            - /etc/dev/config.yaml
          ports:
            - name: proxy
              containerPort: 4455
            - name: api
              containerPort: 4456
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 4456
            periodSeconds: 2
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 500m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: configuration
              mountPath: /etc/dev
              readOnly: true
            - name: configuration
              mountPath: /etc/rules
              readOnly: true
            - name: jwks
              mountPath: /etc/secrets/oathkeeper
              readOnly: true
      volumes:
        - name: configuration
          configMap:
            name: tadoku-cli-oathkeeper
        - name: jwks
          secret:
            secretName: dev-oathkeeper-jwks
---
apiVersion: v1
kind: Service
metadata:
  name: tadoku-cli-oathkeeper
  namespace: default
  labels:
    app.kubernetes.io/managed-by: tadoku-dev-cli
    app.kubernetes.io/part-of: tadoku-dev-cli
spec:
  selector:
    tadoku.dev/role: cli-oathkeeper
  ports:
    - name: proxy
      port: 4455
      targetPort: 4455
---
apiVersion: v1
kind: Service
metadata:
  name: tadoku-cli-api
  namespace: default
  labels:
    app.kubernetes.io/managed-by: tadoku-dev-cli
    app.kubernetes.io/part-of: tadoku-dev-cli
spec:
  type: ExternalName
  externalName: dev-cli-playground-gateway.envoy-gateway-system.svc.cluster.local
  ports:
    - name: http
      port: 80
      targetPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: dev-cli-gateway
  namespace: tadoku-dev-cli
  labels:
    app.kubernetes.io/managed-by: tadoku-dev-cli
    app.kubernetes.io/part-of: tadoku-dev-cli
spec:
  type: ExternalName
  externalName: dev-cli-playground-gateway.envoy-gateway-system.svc.cluster.local
  ports:
    - name: http
      port: 80
      targetPort: 80
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: Backend
metadata:
  name: tadoku-cli-web
  namespace: tadoku-dev-cli
  labels:
    app.kubernetes.io/managed-by: tadoku-dev-cli
    app.kubernetes.io/part-of: tadoku-dev-cli
spec:
  endpoints:
    - fqdn:
        hostname: frontend-webv2.default.svc.cluster.local
        port: 3000
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: Backend
metadata:
  name: tadoku-cli-proxy
  namespace: tadoku-dev-cli
  labels:
    app.kubernetes.io/managed-by: tadoku-dev-cli
    app.kubernetes.io/part-of: tadoku-dev-cli
spec:
  endpoints:
    - fqdn:
        hostname: tadoku-cli-oathkeeper.default.svc.cluster.local
        port: 4455
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: tadoku-cli-proxy-base
  namespace: tadoku-dev-cli
  labels:
    app.kubernetes.io/managed-by: tadoku-dev-cli
    app.kubernetes.io/part-of: tadoku-dev-cli
spec:
  parentRefs:
    - name: dev-cli-playground
      namespace: envoy-gateway-system
  hostnames:
    - tadoku.dev.lab
  rules:
    - backendRefs:
        - group: gateway.envoyproxy.io
          kind: Backend
          name: tadoku-cli-proxy
          port: 4455
      matches:
        - path:
            type: PathPrefix
            value: /api/internal
      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            remove:
              - x-dev-branch
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - name: Cache-Control
                value: no-store
              - name: Vary
                value: Cookie
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: Backend
metadata:
  name: tadoku-cli-api
  namespace: tadoku-dev-cli
  labels:
    app.kubernetes.io/managed-by: tadoku-dev-cli
    app.kubernetes.io/part-of: tadoku-dev-cli
spec:
  endpoints:
    - fqdn:
        hostname: tadoku-api.tdk-tadoku-api.svc.cluster.local
        port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: tadoku-cli-api-base
  namespace: tadoku-dev-cli
  labels:
    app.kubernetes.io/managed-by: tadoku-dev-cli
    app.kubernetes.io/part-of: tadoku-dev-cli
spec:
  parentRefs:
    - name: dev-cli-playground
      namespace: envoy-gateway-system
  hostnames:
    - tadoku-cli-api.default.svc.cluster.local
  rules:
    - backendRefs:
        - group: gateway.envoyproxy.io
          kind: Backend
          name: tadoku-cli-api
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: tadoku-cli-web-base
  namespace: tadoku-dev-cli
  labels:
    app.kubernetes.io/managed-by: tadoku-dev-cli
    app.kubernetes.io/part-of: tadoku-dev-cli
spec:
  parentRefs:
    - name: dev-cli-playground
      namespace: envoy-gateway-system
  hostnames:
    - tadoku.dev.lab
  rules:
    - backendRefs:
        - group: gateway.envoyproxy.io
          kind: Backend
          name: tadoku-cli-web
          port: 3000
      matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            remove:
              - x-dev-branch
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - name: Cache-Control
                value: no-store
              - name: Vary
                value: Cookie
