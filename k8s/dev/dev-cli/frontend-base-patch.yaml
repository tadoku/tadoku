# Strategic merge patch for the existing base; preserve its published image.
# kubectl --context homelab-dev -n default patch deployment frontend-webv2 --type=strategic --patch-file k8s/dev/dev-cli/frontend-base-patch.yaml
spec:
  template:
    spec:
      containers:
        - name: frontend-webv2
          env:
            - name: NEXT_SERVER_API_ENDPOINT
              value: https://tadoku.dev.lab/api/internal
            - name: NODE_EXTRA_CA_CERTS
              value: /etc/dev-ca/ca.crt
          volumeMounts:
            - name: development-ca
              mountPath: /etc/dev-ca
              readOnly: true
      volumes:
        - name: development-ca
          configMap:
            name: tadoku-cli-ca
