apiVersion: v1
kind: Namespace
metadata:
  name: tdk-immersion-api
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: immersion-api
  namespace: tdk-immersion-api
  labels:
    app: immersion-api
spec:
  selector:
    matchLabels:
      app: immersion-api
  template:
    metadata:
      labels:
        app: immersion-api
    spec:
      serviceAccountName: immersion-api
      initContainers:
        - name: migrations
          image: immersion-api-image
          imagePullPolicy: IfNotPresent
          command: ['/migrate']
          args: ['-source', 'file:///migrations', 'up']
          env:
          - {name: POSTGRES_HOST, value: tadoku-dev-db.default}
          - {name: POSTGRES_DATABASE, value: immersion}
          - {name: POSTGRES_SSLMODE, value: require}
          - name: POSTGRES_USER
            valueFrom: {secretKeyRef: {name: immersion.tadoku-dev-db.credentials.postgresql.acid.zalan.do, key: username}}
          - name: POSTGRES_PASSWORD
            valueFrom: {secretKeyRef: {name: immersion.tadoku-dev-db.credentials.postgresql.acid.zalan.do, key: password}}
      containers:
      - name: immersion-api
        image: immersion-api-image
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8000
        - name: metrics
          containerPort: 9090
        env:
          - {name: API_POSTGRES_HOST, value: tadoku-dev-db.default}
          - {name: API_POSTGRES_DATABASE, value: immersion}
          - {name: API_POSTGRES_SSLMODE, value: require}
          - name: API_POSTGRES_USER
            valueFrom: {secretKeyRef: {name: immersion.tadoku-dev-db.credentials.postgresql.acid.zalan.do, key: username}}
          - name: API_POSTGRES_PASSWORD
            valueFrom: {secretKeyRef: {name: immersion.tadoku-dev-db.credentials.postgresql.acid.zalan.do, key: password}}
          - name: API_PORT
            value: "8000"
          - name: API_JWKS
            value: "http://oathkeeper-api.default:4456/.well-known/jwks.json"
          - name: API_KRATOS_URL
            value: "http://kratos-admin.default"
          - name: API_OATHKEEPER_URL
            value: "http://oathkeeper-proxy.default:4455"
          - name: API_KETO_READ_URL
            value: "http://keto-read.default:4466"
          - name: API_KETO_WRITE_URL
            value: "http://keto-write.default:4467"
          - name: API_VALKEY_URL
            value: "redis://valkey-immersion.default:6379"
          - name: API_FLIPT_URL
            value: "http://oathkeeper-proxy.default:4455/flipt"
          - name: API_FLIPT_ENVIRONMENT
            value: "local"
          - name: API_FLIPT_NAMESPACE
            value: "default"
          - name: API_FLIPT_UPDATE_INTERVAL
            value: "30s"
          - name: API_FLIPT_REQUEST_TIMEOUT
            value: "5s"
          - name: API_FLIPT_STARTUP_TIMEOUT
            value: "3s"
          - name: SERVICE_NAME
            value: "immersion-api"
          - name: API_SCORING_ENGINE_ENABLED
            value: "false"
          - name: API_METRICS_PORT
            value: "9090"
        volumeMounts:
        - name: k8s-token
          mountPath: /var/run/secrets/tokens
          readOnly: true
        readinessProbe:
          httpGet:
            scheme: HTTP
            path: /readyz
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 3
        livenessProbe:
          httpGet:
            scheme: HTTP
            path: /livez
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 3
      volumes:
        - name: k8s-token
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: 3600
                  audience: immersion-api
---
apiVersion: v1
kind: Service
metadata:
  name: immersion-api
  namespace: tdk-immersion-api
  labels:
    app: immersion-api
    service: immersion-api
spec:
  ports:
  - port: 80
    targetPort: 8000
    name: http
  selector:
    app: immersion-api
---
apiVersion: v1
kind: Service
metadata:
  name: immersion-api-metrics
  namespace: tdk-immersion-api
  labels:
    app: immersion-api
    service: immersion-api-metrics
spec:
  type: ClusterIP
  ports:
  - port: 9090
    targetPort: metrics
    name: metrics
  selector:
    app: immersion-api
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: immersion-api
  namespace: tdk-immersion-api
