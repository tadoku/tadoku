openapi: 3.0.3
info:
  title: immersion-api-internal
  description: Internal API for service-to-service communication
  license:
    name: MIT
    url: https://github.com/tadoku/tadoku/blob/main/LICENSE
  version: 1.0.0
servers:
  - url: http://immersion-api:8080/
paths:
  /internal/v1/account-deletion-eligibility:
    post:
      summary: Checks whether an account owns a running contest that blocks deletion
      operationId: internalAccountDeletionEligibility
      tags: [internal]
      security:
        - serviceAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountDeletionEligibilityRequest'
      responses:
        '204':
          description: account is currently eligible for deletion
        '400':
          description: invalid request
        '401':
          description: caller is not a service identity
        '403':
          description: caller is not profile-api
        '409':
          description: account owns at least one running contest
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountDeletionEligibilityConflict'
  /internal/v1/account-deletion-scrubs:
    post:
      summary: Idempotently anonymizes and removes immersion data for a locked account
      operationId: internalAccountDeletionScrub
      tags: [internal]
      security:
        - serviceAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountDeletionScrubRequest'
      responses:
        '204':
          description: account data is scrubbed or was already scrubbed
        '400':
          description: invalid request
        '401':
          description: caller is not a service identity
        '403':
          description: caller is not profile-api
        '409':
          description: account is not locked or owns a running contest
  /internal/v1/account-deletion-locks:
    post:
      summary: Idempotently prevents further mutations for an account
      operationId: internalAccountDeletionLock
      tags: [internal]
      security:
        - serviceAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountDeletionLockRequest'
      responses:
        '204':
          description: account is locked or was already locked
        '400':
          description: invalid request
        '401':
          description: caller is not a service identity
        '403':
          description: caller is not profile-api
        '409':
          description: account owns a running contest
components:
  schemas:
    AccountDeletionEligibilityRequest:
      type: object
      required:
        - user_id
      properties:
        user_id:
          type: string
          format: uuid
    AccountDeletionEligibilityConflict:
      type: object
      required:
        - error
        - available_after
      properties:
        error:
          type: string
          enum:
            - running_contest_owned
        available_after:
          type: string
          format: date-time
    AccountDeletionScrubRequest:
      type: object
      required:
        - user_id
        - request_id
      properties:
        user_id:
          type: string
          format: uuid
        request_id:
          type: string
          format: uuid
    AccountDeletionLockRequest:
      type: object
      required:
        - user_id
        - request_id
      properties:
        user_id:
          type: string
          format: uuid
        request_id:
          type: string
          format: uuid
  securitySchemes:
    serviceAuth:
      type: http
      scheme: bearer
      description: JWT token for service-to-service authentication (ES256)
