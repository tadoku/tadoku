apiVersion: v1
kind: Namespace
metadata:
  name: tdk-tadoku-api
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tadoku-api
  namespace: tdk-tadoku-api
  labels:
    app: tadoku-api
spec:
  selector:
    matchLabels:
      app: tadoku-api
  template:
    metadata:
      labels:
        app: tadoku-api
    spec:
      containers:
        - name: tadoku-api
          image: tadoku-api-image
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
            - name: metrics
              containerPort: 9090
          env:
            - {name: API_PORT, value: "8000"}
            - {name: API_METRICS_PORT, value: "9090"}
            - {name: API_SERVICE_NAME, value: tadoku-api}
            - {name: API_AUTHZ_URL, value: "http://authz-api.tdk-authz-api"}
            - {name: API_CONTENT_URL, value: "http://content-api.tdk-content-api"}
            - {name: API_IMMERSION_URL, value: "http://immersion-api.tdk-immersion-api"}
            - {name: API_PROFILE_URL, value: "http://profile-api.tdk-profile-api"}
            - {name: API_JWKS, value: "http://oathkeeper-api.default:4456/.well-known/jwks.json"}
            - {name: API_KETO_READ_URL, value: "http://keto-read.default:4466"}
            - {name: API_POSTGRES_HOST, value: tadoku-dev-db.default}
            - {name: API_POSTGRES_DATABASE, value: immersion}
            - {name: API_POSTGRES_SSLMODE, value: require}
            - {name: API_POSTGRES_MAX_CONNECTIONS, value: "4"}
            - name: API_POSTGRES_USER
              valueFrom: {secretKeyRef: {name: immersion.tadoku-dev-db.credentials.postgresql.acid.zalan.do, key: username}}
            - name: API_POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: immersion.tadoku-dev-db.credentials.postgresql.acid.zalan.do, key: password}}
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 3
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            initialDelaySeconds: 2
            periodSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: tadoku-api
  namespace: tdk-tadoku-api
  labels:
    app: tadoku-api
    service: tadoku-api
spec:
  ports:
    - port: 80
      targetPort: http
      name: http
  selector:
    app: tadoku-api
---
apiVersion: v1
kind: Service
metadata:
  name: tadoku-api-metrics
  namespace: tdk-tadoku-api
  labels:
    app: tadoku-api
    service: tadoku-api-metrics
spec:
  ports:
    - port: 9090
      targetPort: metrics
      name: metrics
  selector:
    app: tadoku-api
