# Canonical Tadoku HTTP contract. Legacy specs are frozen build/compatibility inputs.
openapi: 3.0.3
info:
  title: Tadoku API
  version: 1.0.0
  license:
    name: MIT
    url: https://github.com/tadoku/tadoku/blob/main/LICENSE
  description: Canonical contract for native and proxied Tadoku operations.
    Internal and callback entries are an inventory, not a gateway exposure
    change; their existing direct callers keep the upstream URLs recorded in
    x-tadoku-sources.
servers:
  - url: https://tadoku.app/api
x-tadoku-operational-surfaces:
  description: >-
    Manually registered operational endpoints are not business API operations and are excluded
    from the public documentation projection. Each API exposes GET /livez and GET /readyz on
    its own HTTP listener, and GET /metrics on its separate metrics listener. Legacy health
    endpoints retain their optional-auth middleware. No gateway exposure changes are implied.
  apis:
    - tadoku-api
    - authz-api
    - content-api
    - immersion-api
    - profile-api
  health_paths: [/livez, /readyz]
  metrics_path: /metrics
x-tadoku-sources:
  Authz:
    domain: authz
    exposure: public
    path: services/authz-api/http/rest/openapi/api.yaml
    info:
      title: authz-api
      license:
        name: MIT
        url: https://github.com/tadoku/tadoku/blob/main/LICENSE
      version: 1.0.0
    servers:
      - url: https://tadoku.app/api/authz/
  Content:
    domain: content
    exposure: public
    path: services/content-api/http/rest/openapi/api.yaml
    info:
      title: content-api
      license:
        name: MIT
        url: https://github.com/tadoku/tadoku/blob/main/LICENSE
      version: 1.0.0
    servers:
      - url: https://tadoku.app/api/content/
    externalDocs:
      description: Find out more about Tadoku
      url: https://tadoku.github.io/tadoku/
  Immersion:
    domain: immersion
    exposure: public
    path: services/immersion-api/http/rest/openapi/api.yaml
    info:
      title: immersion-api
      license:
        name: MIT
        url: https://github.com/tadoku/tadoku/blob/main/LICENSE
      version: 2.0.0
    servers:
      - url: https://tadoku.app/api/immersion/
    externalDocs:
      description: Find out more about Tadoku
      url: https://tadoku.github.io/tadoku/
  Profile:
    domain: profile
    exposure: public
    path: services/profile-api/http/rest/openapi/api.yaml
    info:
      title: profile-api
      license:
        name: MIT
        url: https://github.com/tadoku/tadoku/blob/main/LICENSE
      version: 1.0.0
    servers:
      - url: https://tadoku.app/api/profile/
    externalDocs:
      description: Find out more about Tadoku
      url: https://tadoku.github.io/tadoku/
  AuthzInternal:
    domain: authz
    exposure: internal
    path: services/authz-api/http/rest/openapi/internal-api.yaml
    info:
      title: authz-api-internal
      description: Internal API for service-to-service communication
      license:
        name: MIT
        url: https://github.com/tadoku/tadoku/blob/main/LICENSE
      version: 1.0.0
    servers:
      - url: http://authz-api:8080/
  AuthzProxy:
    domain: authz
    exposure: callback
    path: services/authz-api/http/rest/openapi/proxy-api.yaml
    info:
      title: authz-api-oathkeeper-callback
      description: Internal callback API used only by Oathkeeper authorization rules
      license:
        name: MIT
        url: https://github.com/tadoku/tadoku/blob/main/LICENSE
      version: 1.0.0
    servers:
      - url: http://authz-api:8080/
  ImmersionInternal:
    domain: immersion
    exposure: internal
    path: services/immersion-api/http/rest/openapi/internal-api.yaml
    info:
      title: immersion-api-internal
      description: Internal API for service-to-service communication
      license:
        name: MIT
        url: https://github.com/tadoku/tadoku/blob/main/LICENSE
      version: 1.0.0
    servers:
      - url: http://immersion-api:8080/
  ProfileInternal:
    domain: profile
    exposure: internal
    path: services/profile-api/http/rest/openapi/internal-api.yaml
    info:
      title: profile-api-internal
      description: Internal API for service-to-service communication
      license:
        name: MIT
        url: https://github.com/tadoku/tadoku/blob/main/LICENSE
      version: 1.0.0
    servers:
      - url: http://profile-api:8080/
paths:
  /authz/ping:
    get:
      summary: Checks if service is responsive
      operationId: AuthzPing
      tags:
        - metadata
      responses:
        "200":
          description: successful operation
          content:
            text/plain:
              schema:
                type: string
      x-tadoku-source: Authz
      x-tadoku-exposure: public
      x-tadoku-owner: legacy
      x-legacy-path: /ping
      x-legacy-operation-id: ping
  /authz/current-user/role:
    get:
      summary: Fetches the role of the current user
      operationId: AuthzRoleGet
      tags:
        - role
      security:
        - AuthzcookieAuth: []
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthzUserRole"
        "401":
          description: unauthorized
        "503":
          description: authorization unavailable
      x-tadoku-source: Authz
      x-tadoku-exposure: public
      x-tadoku-owner: legacy
      x-legacy-path: /current-user/role
      x-legacy-operation-id: roleGet
  "/authz/users/{id}/role":
    put:
      summary: Update user role (admin only)
      operationId: AuthzRoleUpdate
      tags:
        - admin
      security:
        - AuthzcookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthzRoleUpdateRequest"
      responses:
        "200":
          description: successful operation
        "400":
          description: invalid request
        "401":
          description: unauthorized
        "403":
          description: forbidden (not admin, or target is admin)
        "404":
          description: user not found
        "503":
          description: authorization unavailable
      x-tadoku-source: Authz
      x-tadoku-exposure: public
      x-tadoku-owner: legacy
      x-legacy-path: /users/{id}/role
      x-legacy-operation-id: roleUpdate
  /authz/permission/check:
    post:
      summary: Checks if the current user has a specific permission
      operationId: AuthzPermissionCheck
      tags:
        - permissions
      security:
        - AuthzcookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthzPermissionCheckRequest"
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthzPermissionCheckResponse"
        "400":
          description: invalid request
        "401":
          description: unauthorized
        "403":
          description: forbidden (not allowlisted)
        "503":
          description: authorization unavailable
      x-tadoku-source: Authz
      x-tadoku-exposure: public
      x-tadoku-owner: legacy
      x-legacy-path: /permission/check
      x-legacy-operation-id: permissionCheck
