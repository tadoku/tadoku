components:
  securitySchemes:
    AuthzcookieAuth:
      type: apiKey
      in: cookie
      name: tadoku_session
    ContentcookieAuth:
      type: apiKey
      in: cookie
      name: tadoku_session
    ImmersioncookieAuth:
      type: apiKey
      in: cookie
      name: tadoku_session
    ProfilecookieAuth:
      type: apiKey
      in: cookie
      name: tadoku_session
    AuthzProxyoathkeeperCallbackAuth:
      type: http
      scheme: bearer
      description: Shared callback token presented only by Oathkeeper
    IdentitycookieAuth:
      type: apiKey
      in: cookie
      name: tadoku_session
    EmailcookieAuth:
      type: apiKey
      in: cookie
      name: tadoku_session
    EmailaccessTokenAuth:
      type: http
      scheme: bearer
      bearerFormat: tdk_at_TENANT_SECRET
      description: Tenant email:read access token; never accepted by other API routes
    IdentityProxyoathkeeperCallbackAuth:
      type: http
      scheme: bearer
      description: API_OATHKEEPER_AUTHZ_TOKEN, presented only by Oathkeeper
  responses:
    ImmersionAccountDeletionInProgress:
      description: account deletion is in progress
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ImmersionErrorResponse"
  parameters:
    ImmersionLogLanguageFilter:
      name: language
      in: query
      required: false
      description: Only logs in one of these languages. Repeat the parameter for several values.
      style: form
      explode: true
      schema:
        type: array
        maxItems: 10
        items:
          type: string
          minLength: 1
          maxLength: 10
          example: jpn
    ImmersionLogActivityFilter:
      name: activity
      in: query
      required: false
      description: Only logs of one of these activity IDs. Repeat the parameter for several values.
      style: form
      explode: true
      schema:
        type: array
        maxItems: 10
        items:
          type: integer
          minimum: 1
          maximum: 32767
    ImmersionLogTagFilter:
      name: tag
      in: query
      required: false
      description: >-
        Only logs with any of these tags. Repeat the parameter for several values;
        a comma is part of the tag, not a separator.
      style: form
      explode: true
      schema:
        type: array
        maxItems: 20
        items:
          type: string
          minLength: 1
          maxLength: 50
