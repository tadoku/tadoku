      type: apiKey
      in: cookie
      name: ory_kratos_session
    ContentcookieAuth:
      type: apiKey
      in: cookie
      name: ory_kratos_session
    ImmersioncookieAuth:
      type: apiKey
      in: cookie
      name: ory_kratos_session
    ProfilecookieAuth:
