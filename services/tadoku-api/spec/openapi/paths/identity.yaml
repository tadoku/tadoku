paths:
  /identity/registration:
    post:
      operationId: IdentityRegistrationCreate
      summary: Register an account and create a session
      tags:
      - identity
      security:
      - IdentitycookieAuth: []
      x-tadoku-source: Identity
      x-tadoku-exposure: public
      x-legacy-path: /identity/registration
      x-legacy-operation-id: IdentityRegistrationCreate
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentitySession'
          headers:
            Set-Cookie:
              description: Tenant-specific HttpOnly, Secure, SameSite=Lax session cookie; logout clears
                it.
              schema:
                type: string
                maxLength: 4096
        '400':
          description: Request rejected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityErrorResponse'
        '401':
          description: Request rejected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityErrorResponse'
        '403':
          description: Request rejected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityErrorResponse'
        '409':
          description: Request rejected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityErrorResponse'
        '501':
          description: Not implemented
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityErrorResponse'
        '503':
          description: Request rejected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityErrorResponse'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IdentityRegistration'
