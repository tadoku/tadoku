  /identity/recovery/{token}:
    get:
      operationId: IdentityRecoveryConsume
      summary: Consume a recovery token and redirect to Settings
      tags:
      - identity
      security:
      - IdentitycookieAuth: []
      x-tadoku-source: Identity
      x-tadoku-exposure: public
      x-legacy-path: /identity/recovery/{token}
      x-legacy-operation-id: IdentityRecoveryConsume
      responses:
        '303':
          description: Success
          headers:
            Set-Cookie:
              description: Tenant-specific HttpOnly, Secure, SameSite=Lax session cookie; logout clears
                it.
              schema:
                type: string
                maxLength: 4096
            Location:
              description: Allowlisted Settings URL
              schema:
                type: string
                maxLength: 2048
                format: uri
        '400':
          description: Request rejected
          content:
            application/json:
              schema:
