paths:
  "/immersion/contests/{id}/profile/{user_id}/scores":
    get:
      summary: Fetches the scores of a user profile in a contest
      operationId: ImmersionContestProfileFetchScores
      tags:
        - contests_profile
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: user_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImmersionContestProfileScores"
        "404":
          description: not found
        "500":
          description: participant statistics could not be fetched
      x-tadoku-source: Immersion
      x-tadoku-exposure: public
      x-legacy-path: /contests/{id}/profile/{user_id}/scores
      x-legacy-operation-id: contestProfileFetchScores
  "/immersion/contests/{id}/profile/{user_id}/activity":
    get:
      summary: Fetches the activity of a user profile in a contest
      operationId: ImmersionContestProfileFetchActivity
      tags:
        - contests_profile
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: user_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImmersionContestProfileActivity"
        "404":
          description: not found
        "500":
          description: participant statistics could not be fetched
      x-tadoku-source: Immersion
      x-tadoku-exposure: public
      x-legacy-path: /contests/{id}/profile/{user_id}/activity
      x-legacy-operation-id: contestProfileFetchActivity
  "/immersion/contests/{id}/profile/{user_id}/summary":
    get:
      summary: Summarizes a user's logs in a contest, with breakdowns for filtering
      description: >-
        Totals, scores per day and activity, and score breakdowns by language,
        activity and tag of the user's undeleted logs in the contest. Filters
        combine with "and"; several values of one filter combine with "or". An
        unknown contest or user, or a user without logs, returns zero totals and
        empty lists.
      operationId: ImmersionContestProfileFetchSummary
      tags:
        - contests_profile
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: user_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/ImmersionLogLanguageFilter"
        - $ref: "#/components/parameters/ImmersionLogActivityFilter"
        - $ref: "#/components/parameters/ImmersionLogTagFilter"
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImmersionContestProfileSummary"
        "400":
          description: invalid identifier or filter
        "500":
          description: participant statistics could not be fetched
      x-tadoku-source: Immersion
      x-tadoku-exposure: public
      x-legacy-path: /contests/{id}/profile/{user_id}/summary
      x-legacy-operation-id: contestProfileFetchSummary
