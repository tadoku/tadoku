paths:
  /immersion/feature-flags:
    get:
      summary: Returns public feature flag decisions for the current user
      operationId: ImmersionFeatureFlagDecisions
      tags:
        - metadata
      responses:
        "200":
          description: Public feature flag decisions
          headers:
            Cache-Control:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImmersionFeatureFlagDecisionsResponse"
      x-tadoku-source: Immersion
      x-tadoku-exposure: public
      x-legacy-path: /feature-flags
      x-legacy-operation-id: featureFlagDecisions
  "/immersion/admin/feature-flags/{flagKey}/users/{userId}":
    get:
      summary: Returns named-user access for an allowlisted feature flag (admin only)
      operationId: ImmersionFeatureAccessGet
      tags:
        - admin
      security:
        - ImmersioncookieAuth: []
      responses:
        "200":
          description: Named-user feature access
          headers:
            Cache-Control:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImmersionFeatureAccessResponse"
        "400":
          description: invalid request
        "401":
          description: unauthorized
        "403":
          description: forbidden (not admin)
        "502":
          description: feature configuration unavailable
      parameters:
        - &a1
          name: flagKey
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/ImmersionManagedFeatureFlagKey"
        - &a2
          name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      x-tadoku-source: Immersion
      x-tadoku-exposure: public
      x-legacy-path: /admin/feature-flags/{flagKey}/users/{userId}
      x-legacy-operation-id: featureAccessGet
    put:
      summary: Grants named-user access to an allowlisted feature flag (admin only)
      operationId: ImmersionFeatureAccessGrant
      tags:
        - admin
      security:
        - ImmersioncookieAuth: []
      responses:
        "200":
          description: Updated named-user feature access
          headers:
            Cache-Control:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImmersionFeatureAccessResponse"
        "400":
          description: invalid request
        "401":
          description: unauthorized
        "403":
          description: forbidden (not admin)
        "502":
          description: feature configuration unavailable
      parameters:
        - *a1
        - *a2
      x-tadoku-source: Immersion
      x-tadoku-exposure: public
      x-legacy-path: /admin/feature-flags/{flagKey}/users/{userId}
      x-legacy-operation-id: featureAccessGrant
    delete:
      summary: Revokes named-user access to an allowlisted feature flag (admin only)
      operationId: ImmersionFeatureAccessRevoke
      tags:
        - admin
      security:
        - ImmersioncookieAuth: []
      responses:
        "200":
          description: Updated named-user feature access
          headers:
            Cache-Control:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImmersionFeatureAccessResponse"
        "400":
          description: invalid request
        "401":
          description: unauthorized
        "403":
          description: forbidden (not admin)
        "502":
          description: feature configuration unavailable
      parameters:
        - *a1
        - *a2
      x-tadoku-source: Immersion
      x-tadoku-exposure: public
      x-legacy-path: /admin/feature-flags/{flagKey}/users/{userId}
      x-legacy-operation-id: featureAccessRevoke
