paths:
  "/immersion/users/{userId}/profile":
    get:
      summary: Fetches a profile of a user
      operationId: ImmersionProfileFindByUserID
      tags:
        - profile
      parameters:
        - name: userId
          in: path
          description: ID of user to return
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImmersionUserProfile"
        "404":
          description: not found
        "500":
          description: profile read failed
      x-tadoku-source: Immersion
      x-tadoku-exposure: public
      x-legacy-path: /users/{userId}/profile
      x-legacy-operation-id: profileFindByUserID
  "/immersion/users/{userId}/avatar":
    get:
      summary: Fetches the Gravatar avatar of a user
      description: >-
        Returns the user's Gravatar image at 128 pixels, fetched and cached by the
        server so neither the user's email nor the viewer's address reaches Gravatar.
        The server caches an image, or the absence of one, for up to 24 hours, so a
        changed email or Gravatar image can take that long to appear.
      operationId: ImmersionProfileAvatarByUserID
      tags:
        - profile
      parameters:
        - name: userId
          in: path
          description: ID of the user whose avatar to return
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The avatar image, as JPEG, PNG, GIF or WebP.
          headers:
            Cache-Control:
              description: Always public, max-age=86400.
              required: true
              schema:
                type: string
            X-Content-Type-Options:
              description: Always nosniff.
              required: true
              schema:
                type: string
          content:
            image/*:
              schema:
                type: string
                format: binary
        "400":
          description: Invalid user ID.
        "404":
          description: The user does not exist or has no Gravatar image.
        "503":
          description: Gravatar failed or returned an unusable image.
        "504":
          description: Gravatar did not respond in time.
      x-tadoku-source: Immersion
      x-tadoku-exposure: public
      x-legacy-path: /users/{userId}/avatar
      x-legacy-operation-id: profileAvatarByUserID
  "/immersion/users/{userId}/activity/{year}":
    get:
      summary: Fetches a activity summary of a user for a given year
      operationId: ImmersionProfileYearlyActivityByUserID
      tags:
        - profile
      parameters:
        - name: userId
          in: path
          description: ID of user to return
          required: true
          schema:
            type: string
            format: uuid
        - name: year
          in: path
          description: year of activity to fetch
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImmersionUserActivity"
        "404":
          description: not found
        "500":
          description: profile read failed
      x-tadoku-source: Immersion
      x-tadoku-exposure: public
      x-legacy-path: /users/{userId}/activity/{year}
      x-legacy-operation-id: profileYearlyActivityByUserID
  "/immersion/users/{userId}/scores/{year}":
    get:
      summary: Fetches the scores of a user for a given year
      operationId: ImmersionProfileYearlyScoresByUserID
      tags:
        - profile
      parameters:
        - name: userId
          in: path
          description: ID of user to return
          required: true
          schema:
            type: string
            format: uuid
        - name: year
          in: path
          description: year of activity to fetch
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImmersionProfileScores"
        "404":
          description: not found
        "500":
          description: profile read failed
      x-tadoku-source: Immersion
      x-tadoku-exposure: public
      x-legacy-path: /users/{userId}/scores/{year}
      x-legacy-operation-id: profileYearlyScoresByUserID
  "/immersion/users/{user_id}/logs":
    get:
      summary: Lists the logs of a user
      operationId: ImmersionProfileListLogs
      tags:
        - profile
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: include_deleted
          in: query
          required: false
          allowEmptyValue: true
          schema:
            type: boolean
        - name: page_size
          in: query
          required: false
          schema:
            type: integer
        - name: page
          in: query
          required: false
          schema:
            type: integer
        - name: date
          in: query
          description: Only logs created on this UTC calendar day, the day buckets of the yearly activity heatmap.
          required: false
          schema:
            type: string
            format: date
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImmersionLogs"
        "404":
          description: not found
        "500":
          description: log list could not be fetched
      x-tadoku-source: Immersion
      x-tadoku-exposure: public
      x-legacy-path: /users/{user_id}/logs
      x-legacy-operation-id: profileListLogs
  "/immersion/users/{userId}/contest-registrations/{year}":
    get:
      summary: Fetches the contest registrations of a user for a given year
      description: >-
        Includes private contests for the current user and admins. Results are
        paginated with a zero-based `page`; `page_size` defaults to 50, and 0 or
        values above 50 are treated as 50.
      operationId: ImmersionProfileYearlyContestRegistrationsByUserID
      tags:
        - profile
      parameters:
        - name: userId
          in: path
          description: ID of user to return
          required: true
          schema:
            type: string
            format: uuid
        - name: year
          in: path
          description: year of activity to fetch
          required: true
          schema:
            type: integer
        - name: page_size
          in: query
          required: false
          schema:
            type: integer
        - name: page
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ImmersionContestRegistrations"
                  - type: object
                    properties:
                      registrations:
                        type: array
                        maxItems: 50
                        items:
                          $ref: "#/components/schemas/ImmersionContestRegistration"
      x-tadoku-source: Immersion
      x-tadoku-exposure: public
      x-legacy-path: /users/{userId}/contest-registrations/{year}
      x-legacy-operation-id: profileYearlyContestRegistrationsByUserID
  "/immersion/users/{userId}/activity-split/{year}":
    get:
      summary: Fetches a activity split summary of a user for a given year
      operationId: ImmersionProfileYearlyActivitySplitByUserID
      tags:
        - profile
      parameters:
        - name: userId
          in: path
          description: ID of user to return
          required: true
          schema:
            type: string
            format: uuid
        - name: year
          in: path
          description: year of activity to fetch
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImmersionActivitySplit"
        "404":
          description: not found
        "500":
          description: profile read failed
      x-tadoku-source: Immersion
      x-tadoku-exposure: public
      x-legacy-path: /users/{userId}/activity-split/{year}
      x-legacy-operation-id: profileYearlyActivitySplitByUserID
