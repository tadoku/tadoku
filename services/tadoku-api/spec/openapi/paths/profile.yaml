paths:
  /profile/users:
    get:
      summary: Lists all users (admin only)
      operationId: ProfileUsersList
      tags:
        - admin
      security:
        - ProfilecookieAuth: []
      parameters:
        - name: page_size
          in: query
          required: false
          schema:
            type: integer
        - name: page
          in: query
          required: false
          schema:
            type: integer
        - name: query
          in: query
          required: false
          schema:
            type: string
          description: Fuzzy search on display name and email
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileUserList"
        "401":
          description: unauthorized
        "403":
          description: forbidden (not admin)
      x-tadoku-source: Profile
      x-tadoku-exposure: public
      x-legacy-path: /users
      x-legacy-operation-id: usersList
