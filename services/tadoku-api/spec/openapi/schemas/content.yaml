components:
  schemas:
    ContentPage:
      type: object
      required:
        - slug
        - title
      properties:
        id:
          type: string
          format: uuid
          example: d7e82f70-f7b9-4952-8258-1e4d16f0c244
        slug:
          type: string
          example: welcome-to-tadoku
        title:
          type: string
          example: Welcome to Tadoku!
        html:
          type: string
          example: <p>Example page!</p>
        published_at:
          type: string
          format: date-time
          example: 2022-12-14T19:48:00Z
        created_at:
          type: string
          format: date-time
          example: 2022-12-14T19:48:00Z
        updated_at:
          type: string
          format: date-time
          example: 2022-12-14T19:48:00Z
    ContentPages:
      allOf:
        - $ref: "#/components/schemas/ContentPaginatedList"
        - type: object
          required:
            - pages
          properties:
            pages:
              type: array
              maxItems: 100
              items:
                $ref: "#/components/schemas/ContentPage"
    ContentPost:
      type: object
      required:
        - slug
        - title
        - content
      properties:
        id:
          type: string
          format: uuid
          example: d7e82f70-f7b9-4952-8258-1e4d16f0c244
        namespace:
          type: string
          example: tadoku
        slug:
          type: string
          example: welcome-to-tadoku
        title:
          type: string
          example: Welcome to Tadoku!
        content:
          type: string
          format: markdown
          example: This an example **with markdown**.
        published_at:
          type: string
          format: date-time
          example: 2022-12-14T19:48:00Z
        created_at:
          type: string
          format: date-time
          example: 2022-12-14T19:48:00Z
        updated_at:
          type: string
          format: date-time
          example: 2022-12-14T19:48:00Z
    ContentPosts:
      allOf:
        - $ref: "#/components/schemas/ContentPaginatedList"
        - type: object
          required:
            - posts
          properties:
            posts:
              type: array
              maxItems: 100
              items:
                $ref: "#/components/schemas/ContentPost"
    ContentPageVersion:
      type: object
      required:
        - id
        - version
        - title
        - created_at
      properties:
        id:
          type: string
          format: uuid
          description: Content ID of this version
        version:
          type: integer
          example: 1
          description: Version number (starting at 1)
        title:
          type: string
        html:
          type: string
        created_at:
          type: string
          format: date-time
    ContentPageVersions:
      type: object
      required:
        - versions
      properties:
        versions:
          type: array
          items:
            $ref: "#/components/schemas/ContentPageVersion"
    ContentPostVersion:
      type: object
      required:
        - id
        - version
        - title
        - created_at
      properties:
        id:
          type: string
          format: uuid
          description: Content ID of this version
        version:
          type: integer
          example: 1
          description: Version number (starting at 1)
        title:
          type: string
        content:
          type: string
        created_at:
          type: string
          format: date-time
    ContentPostVersions:
      type: object
      required:
        - versions
      properties:
        versions:
          type: array
          items:
            $ref: "#/components/schemas/ContentPostVersion"
    ContentAnnouncement:
      type: object
      required:
        - title
        - content
        - style
        - starts_at
        - ends_at
      properties:
        id:
          type: string
          format: uuid
          example: d7e82f70-f7b9-4952-8258-1e4d16f0c244
        namespace:
          type: string
          example: tadoku
        title:
          type: string
          example: Scheduled Maintenance
        content:
          type: string
          format: markdown
          example: The site will be down for maintenance on **Friday**.
        style:
          type: string
          enum:
            - success
            - warning
            - error
            - info
          example: warning
        href:
          type: string
          maxLength: 2048
          nullable: true
          example: https://tadoku.app/blog/posts/maintenance
        starts_at:
          type: string
          format: date-time
          example: 2022-12-14T19:48:00Z
        ends_at:
          type: string
          format: date-time
          example: 2022-12-15T19:48:00Z
        created_at:
          type: string
          format: date-time
          example: 2022-12-14T19:48:00Z
        updated_at:
          type: string
          format: date-time
          example: 2022-12-14T19:48:00Z
    ContentAnnouncements:
      type: object
      required:
        - announcements
      properties:
        announcements:
          type: array
          items:
            $ref: "#/components/schemas/ContentAnnouncement"
    ContentAnnouncementList:
      allOf:
        - $ref: "#/components/schemas/ContentPaginatedList"
        - type: object
          required:
            - announcements
          properties:
            announcements:
              type: array
              maxItems: 100
              items:
                $ref: "#/components/schemas/ContentAnnouncement"
    ContentPaginatedList:
      type: object
      required:
        - next_page_token
        - total_size
      properties:
        total_size:
          type: integer
          example: 100
        next_page_token:
          type: string
          description: is empty if there's no next page
          example: "3"
