components:
  schemas:
    IdentityProxyTraits:
      type: object
      properties:
        email:
          type: string
          pattern: '^[\s\S]+@[\s\S]+$'
          description: >-
            The account's stored address: a v1 Kratos trait, or for v2 the
            normalized address registration or settings stored or an imported
            address as written. The API writes the address part Go's net/mail
            reads from it, so a quoted local part arrives unquoted and surrounding
            ASCII spaces and tabs are dropped; letter case, every other character
            and its length are kept. It is not normalized like email input and
            need not satisfy format: email.
          x-go-type: openapi_types.Email
          x-go-type-import:
            name: openapi_types
            path: github.com/oapi-codegen/runtime/types
        display_name:
          type: string
          maxLength: 32
          minLength: 2
      required:
      - email
      - display_name
    IdentityProxyUser:
      type: object
      properties:
        identity:
          type: object
          properties:
            id:
              type: string
              maxLength: 36
              format: uuid
            traits:
              $ref: '#/components/schemas/IdentityProxyTraits'
          required:
          - id
          - traits
        authenticated_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
      required:
      - identity
      - authenticated_at
      - expires_at
    IdentityProxyGuest:
      type: object
      properties:
        identity:
          type: object
          properties:
            id:
              type: string
              enum:
              - guest
          required:
          - id
      required:
      - identity
    IdentityProxySession:
      oneOf:
      - $ref: '#/components/schemas/IdentityProxyGuest'
      - $ref: '#/components/schemas/IdentityProxyUser'
    IdentityProxyErrorResponse:
      type: object
      properties:
        message:
          type: string
          maxLength: 1000
      required:
      - message
