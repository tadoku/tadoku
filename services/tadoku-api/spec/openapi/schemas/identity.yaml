components:
  schemas:
    IdentityErrorResponse:
      type: object
      properties:
        message:
          type: string
          maxLength: 1000
        code:
          type: string
          maxLength: 64
          enum:
          - wrong_password
          - throttled
          - email_taken
          - stale_session
          - invalid_display_name
          - invalid_email
          - invalid_password
          - invalid_recovery_token
          - invalid_origin
          - invalid_return_to
          - not_implemented
          - unavailable
      required:
      - message
    IdentityAccount:
      type: object
      properties:
        id:
          type: string
          maxLength: 36
          format: uuid
        email:
          type: string
          pattern: '^[\s\S]+@[\s\S]+$'
          description: >-
            The account's stored address: the normalized address registration or
            settings stored, or an imported address as written. When Go's net/mail
            reads an address from it, the
            API writes that address part, so a quoted local part arrives unquoted
            and surrounding ASCII spaces and tabs are dropped; letter case, every
            other character and its length are kept. Otherwise, such as for an
            imported address with a leading vertical tab, the API writes the
            stored address unchanged. It is not normalized like email input and
            need not satisfy format: email.
        display_name:
          type: string
          maxLength: 32
          minLength: 2
        created_at:
          type: string
          format: date-time
        authenticated_at:
          type: string
          format: date-time
      required:
      - id
      - email
      - display_name
      - created_at
      - authenticated_at
    IdentitySession:
      type: object
      properties:
        account:
          allOf:
          - $ref: '#/components/schemas/IdentityAccount'
          nullable: true
        recent_login:
          type: boolean
          description: >-
            True when the session's authentication time is at most one hour ago
            and not in the future, the window in which email and password changes
            are allowed without a stale_session error. False otherwise and for a
            guest. The API always sends it.
      required:
      - account
    IdentityRegistration:
      type: object
      properties:
        email:
          type: string
          maxLength: 320
          format: email
        display_name:
          type: string
          maxLength: 32
          minLength: 2
        password:
          type: string
          maxLength: 72
          minLength: 8
          description: At least 8 characters, at most 72 UTF-8 bytes; rejects a password
            whose lowercase form is within Levenshtein distance 4 of the lowercase
            email or shares with it a common substring longer than half the
            password.
      required:
      - email
      - display_name
      - password
    IdentityLogin:
      type: object
      properties:
        email:
          type: string
          maxLength: 320
          format: email
        password:
          type: string
          maxLength: 72
          minLength: 8
          description: At least 8 characters, at most 72 UTF-8 bytes; rejects a password
            whose lowercase form is within Levenshtein distance 4 of the lowercase
            email or shares with it a common substring longer than half the
            password.
      required:
      - email
      - password
    IdentityRecovery:
      type: object
      properties:
        email:
          type: string
          maxLength: 320
          format: email
        return_to:
          type: string
          maxLength: 2048
          format: uri
          description: >-
            Must use an allowed Tadoku app host. The complete Settings URL,
            including this continuation, must fit within 2,048 bytes; oversized
            destinations are rejected uniformly before account lookup.
      required:
      - email
      - return_to
    IdentityProfileSettings:
      type: object
      minProperties: 1
      properties:
        email:
          type: string
          maxLength: 320
          format: email
        display_name:
          type: string
          maxLength: 32
          minLength: 2
    IdentityPasswordSettings:
      type: object
      properties:
        password:
          type: string
          maxLength: 72
          minLength: 8
          description: At least 8 characters, at most 72 UTF-8 bytes; rejects a password
            whose lowercase form is within Levenshtein distance 4 of the lowercase
            email or shares with it a common substring longer than half the
            password.
      required:
      - password
