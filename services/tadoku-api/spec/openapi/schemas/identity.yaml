components:
  schemas:
    IdentityErrorResponse:
      type: object
      properties:
        message:
          type: string
          maxLength: 1000
        code:
          type: string
          maxLength: 64
          enum:
          - wrong_password
          - throttled
          - email_taken
          - stale_session
          - invalid_display_name
          - invalid_email
          - invalid_password
          - invalid_recovery_token
          - invalid_origin
          - invalid_return_to
          - not_implemented
          - unavailable
      required:
      - message
    IdentityAccount:
      type: object
      properties:
        id:
          type: string
          maxLength: 36
          format: uuid
        email: &id002
          type: string
          maxLength: 320
          format: email
        display_name: &id003
          type: string
          maxLength: 32
          minLength: 2
        created_at: &id001
          type: string
          format: date-time
        authenticated_at: *id001
      required:
      - id
      - email
      - display_name
      - created_at
      - authenticated_at
    IdentitySession:
      type: object
      properties:
        account_app:
          type: string
          enum:
          - v1
          - v2
        account:
          allOf:
          - $ref: '#/components/schemas/IdentityAccount'
          nullable: true
      required:
      - account_app
      - account
    IdentityRegistration:
      type: object
      properties:
        email: *id002
        display_name: *id003
        password: &id004
          type: string
          maxLength: 72
          minLength: 8
          description: At least 8 characters, at most 72 UTF-8 bytes; rejects similarity to the email
            under the Kratos v26.2.0 rule.
      required:
      - email
      - display_name
      - password
    IdentityLogin:
      type: object
      properties:
        email: *id002
        password: *id004
      required:
      - email
      - password
    IdentityRecovery:
      type: object
      properties:
        email: *id002
        return_to:
          type: string
          maxLength: 2048
          format: uri
          description: Must use an allowed Tadoku app host.
      required:
      - email
      - return_to
    IdentityProfileSettings:
      type: object
      minProperties: 1
      properties:
        email: *id002
        display_name: *id003
    IdentityPasswordSettings:
      type: object
      properties:
        password: *id004
      required:
      - password
