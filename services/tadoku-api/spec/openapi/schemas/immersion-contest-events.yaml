components:
  schemas:
    ImmersionContestEvent:
      type: object
      additionalProperties: false
      required:
        - id
        - log_id
        - event
      properties:
        id:
          type: string
          format: uuid
          description: Stable event identity, also usable as a cursor and deduplication key.
        log_id:
          type: string
          format: uuid
        event:
          type: string
          enum:
            - log.submitted
            - log.updated
            - log.withdrawn
          description: |
            submitted means the log entered this contest. updated means its
            contest-visible log fields changed while it remained submitted.
            withdrawn means it left this contest, including deletion or moderation.
    ImmersionContestEventPage:
      type: object
      additionalProperties: false
      required:
        - events
        - next_cursor
        - has_more
      properties:
        events:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/ImmersionContestEvent"
        next_cursor:
          type: string
          minLength: 1
          maxLength: 36
          description: Last returned event ID, the input event ID on an empty poll, or 0 before any event.
        has_more:
          type: boolean
          description: More visible events existed beyond this page at the time of the read.
