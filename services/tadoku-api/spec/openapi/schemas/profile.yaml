components:
  schemas:
    ProfileUserList:
      type: object
      required:
        - users
        - total_size
      properties:
        users:
          type: array
          items:
            $ref: "#/components/schemas/ProfileUserListEntry"
        total_size:
          type: integer
    ProfileUserListEntry:
      type: object
      required:
        - id
        - display_name
        - email
        - created_at
      properties:
        id:
          type: string
        display_name:
          type: string
        email:
          type: string
        created_at:
          type: string
        role:
          type: string
    ProfileAccountDeletionRequest:
      type: object
      required:
        - email
        - reason
      properties:
        email:
          type: string
          maxLength: 320
          description: >-
            The account's email address as the administrator typed it, compared with the account's address after
            normalization, so letter case and surrounding whitespace do not matter. It has no format, so an
            imported address that is not a valid email can still be confirmed.
        reason:
          type: string
          minLength: 1
          maxLength: 1000
          description: >-
            Why the account is deleted, kept in the audit log for good. Surrounding whitespace is trimmed. Do not
            include the user's email address or display name.
    ProfileAccountDeletionFiled:
      type: object
      required:
        - job_id
      properties:
        job_id:
          type: integer
          format: int64
          description: The ID of the account.delete.v1 job that deletes the account's data.
    ProfileErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          enum:
            - confirmation_mismatch
            - admin_account
            - account_deletion_in_progress
