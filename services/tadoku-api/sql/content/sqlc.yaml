version: "2"
sql:
  - engine: postgresql
    schema: ../../../immersion-api/storage/postgres/migrations
    queries:
      - announcements.sql
      - post_delete.sql
      - post_find.sql
      - post_list.sql
      - post_create.sql
    gen:
      go:
        package: content
        out: ../../generated/sqlc/content
        sql_package: pgx/v5
        emit_empty_slices: true
        omit_unused_structs: true
