version: "2"
sql:
  - engine: postgresql
    schema: ../../../immersion-api/storage/postgres/migrations
    queries:
      - leaderboard.sql
    gen:
      go:
        package: leaderboard
        out: ../../generated/sqlc/leaderboard
        sql_package: pgx/v5
        emit_empty_slices: true
        omit_unused_structs: true
