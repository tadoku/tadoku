version: "2"
sql:
  - engine: postgresql
    schema: ../../migrations
    queries:
      - page_find.sql
      - page_list.sql
      - page_create.sql
      - page_update.sql
      - page_delete.sql
      - page_version_list.sql
      - page_version_get.sql
    gen:
      go:
        package: pages
        out: ../../generated/sqlc/pages
        sql_package: pgx/v5
        emit_empty_slices: true
        omit_unused_structs: true
