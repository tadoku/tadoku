version: "2"
sql:
  - engine: postgresql
    schema: ../../../immersion-api/storage/postgres/migrations
    queries:
      - account_deletion.sql
    gen:
      go:
        package: profile
        out: ../../generated/sqlc/profile
        sql_package: pgx/v5
        emit_empty_slices: true
        omit_unused_structs: true
